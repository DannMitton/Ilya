<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="Source Sans 3, system-ui, sans-serif"><rect width="760" height="520" fill="#F0EBE0"/><text x="20" y="24" font-size="13" font-weight="600" fill="#1a1612">Where the thumb stops travelling and the ribbon starts sliding</text><text x="20" y="41" font-size="10" fill="#6A655F">Seven nodes fit a 390 px phone. The only choice is how near the edge the thumb may get before the ribbon moves.</text><text x="20" y="72" font-size="11" font-weight="600" fill="#4a4540">LATE · slides only at the last node</text><text x="400" y="72" font-size="11" font-weight="600" fill="#4a4540">EARLY · slides one node sooner</text><text x="20" y="86" font-size="9.5" fill="#1a1612">She opens on the printed key.</text><rect x="20" y="92" width="330" height="56" rx="10" fill="#fff" stroke="#1a1612" stroke-width="1.2"/><rect x="32" y="118" width="306" height="5" rx="2.5" fill="#E2DAEB"/><line x1="44" y1="125" x2="44" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="44" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">−3</text><line x1="90" y1="125" x2="90" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="90" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">−2</text><line x1="136" y1="125" x2="136" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="136" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">−1</text><line x1="182" y1="125" x2="182" y2="131" stroke="#1a1612" stroke-width="1.3"/><text x="182" y="111" font-size="10.5" fill="#6C4D8C" text-anchor="middle">ORIG.</text><circle cx="182" cy="120" r="11" fill="#6C4D8C"/><circle cx="182" cy="120" r="11" fill="none" stroke="#fff" stroke-width="2"/><line x1="228" y1="125" x2="228" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="228" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">+1</text><line x1="274" y1="125" x2="274" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="274" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">+2</text><line x1="320" y1="125" x2="320" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="320" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">+3</text><text x="20" y="162" font-size="9" fill="#6A655F"></text><rect x="400" y="92" width="330" height="56" rx="10" fill="#fff" stroke="#1a1612" stroke-width="1.2"/><rect x="412" y="118" width="306" height="5" rx="2.5" fill="#E2DAEB"/><line x1="424" y1="125" x2="424" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="424" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">−3</text><line x1="470" y1="125" x2="470" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="470" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">−2</text><line x1="516" y1="125" x2="516" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="516" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">−1</text><line x1="562" y1="125" x2="562" y2="131" stroke="#1a1612" stroke-width="1.3"/><text x="562" y="111" font-size="10.5" fill="#6C4D8C" text-anchor="middle">ORIG.</text><circle cx="562" cy="120" r="11" fill="#6C4D8C"/><circle cx="562" cy="120" r="11" fill="none" stroke="#fff" stroke-width="2"/><line x1="608" y1="125" x2="608" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="608" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">+1</text><line x1="654" y1="125" x2="654" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="654" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">+2</text><line x1="700" y1="125" x2="700" y2="131" stroke="#6A655F" stroke-width="1.3"/><text x="700" y="111" font-size="10.5" fill="#6A655F" text-anchor="middle">+3</text><text x="400" y="162" font-size="9" fill="#6A655F"></text><text x="20" y="182" font-size="9.5" fill="#1a1612">She moves to −2.</text><rect x="20" y="188" width="330" height="56" rx="10" fill="#fff" stroke="#1a1612" stroke-width="1.2"/><rect x="32" y="214" width="306" height="5" rx="2.5" fill="#E2DAEB"/><line x1="44" y1="221" x2="44" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="44" y="207" font-size="10.5" fill="#6A655F" text-anchor="middle">−3</text><line x1="90" y1="221" x2="90" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="90" y="207" font-size="10.5" fill="#6C4D8C" text-anchor="middle">−2</text><circle cx="90" cy="216" r="11" fill="#6C4D8C"/><circle cx="90" cy="216" r="11" fill="none" stroke="#fff" stroke-width="2"/><line x1="136" y1="221" x2="136" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="136" y="207" font-size="10.5" fill="#6A655F" text-anchor="middle">−1</text><line x1="182" y1="221" x2="182" y2="227" stroke="#1a1612" stroke-width="1.3"/><text x="182" y="207" font-size="10.5" fill="#1a1612" text-anchor="middle">ORIG.</text><line x1="228" y1="221" x2="228" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="228" y="207" font-size="10.5" fill="#6A655F" text-anchor="middle">+1</text><line x1="274" y1="221" x2="274" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="274" y="207" font-size="10.5" fill="#6A655F" text-anchor="middle">+2</text><line x1="320" y1="221" x2="320" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="320" y="207" font-size="10.5" fill="#6A655F" text-anchor="middle">+3</text><text x="20" y="258" font-size="9" fill="#6A655F"></text><rect x="400" y="188" width="330" height="56" rx="10" fill="#fff" stroke="#1a1612" stroke-width="1.2"/><rect x="412" y="214" width="306" height="5" rx="2.5" fill="#E2DAEB"/><line x1="424" y1="221" x2="424" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="424" y="207" font-size="10.5" fill="#6A655F" text-anchor="middle">−4</text><line x1="470" y1="221" x2="470" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="470" y="207" font-size="10.5" fill="#6A655F" text-anchor="middle">−3</text><line x1="516" y1="221" x2="516" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="516" y="207" font-size="10.5" fill="#6C4D8C" text-anchor="middle">−2</text><circle cx="516" cy="216" r="11" fill="#6C4D8C"/><circle cx="516" cy="216" r="11" fill="none" stroke="#fff" stroke-width="2"/><line x1="562" y1="221" x2="562" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="562" y="207" font-size="10.5" fill="#6A655F" text-anchor="middle">−1</text><line x1="608" y1="221" x2="608" y2="227" stroke="#1a1612" stroke-width="1.3"/><text x="608" y="207" font-size="10.5" fill="#1a1612" text-anchor="middle">ORIG.</text><line x1="654" y1="221" x2="654" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="654" y="207" font-size="10.5" fill="#6A655F" text-anchor="middle">+1</text><line x1="700" y1="221" x2="700" y2="227" stroke="#6A655F" stroke-width="1.3"/><text x="700" y="207" font-size="10.5" fill="#6A655F" text-anchor="middle">+2</text><text x="400" y="258" font-size="9" fill="#6A655F"></text><text x="20" y="278" font-size="9.5" fill="#1a1612">She moves to −4.</text><rect x="20" y="284" width="330" height="56" rx="10" fill="#fff" stroke="#1a1612" stroke-width="1.2"/><rect x="32" y="310" width="306" height="5" rx="2.5" fill="#E2DAEB"/><line x1="44" y1="317" x2="44" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="44" y="303" font-size="10.5" fill="#6A655F" text-anchor="middle">−5</text><line x1="90" y1="317" x2="90" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="90" y="303" font-size="10.5" fill="#6C4D8C" text-anchor="middle">−4</text><circle cx="90" cy="312" r="11" fill="#6C4D8C"/><circle cx="90" cy="312" r="11" fill="none" stroke="#fff" stroke-width="2"/><line x1="136" y1="317" x2="136" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="136" y="303" font-size="10.5" fill="#6A655F" text-anchor="middle">−3</text><line x1="182" y1="317" x2="182" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="182" y="303" font-size="10.5" fill="#6A655F" text-anchor="middle">−2</text><line x1="228" y1="317" x2="228" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="228" y="303" font-size="10.5" fill="#6A655F" text-anchor="middle">−1</text><line x1="274" y1="317" x2="274" y2="323" stroke="#1a1612" stroke-width="1.3"/><text x="274" y="303" font-size="10.5" fill="#1a1612" text-anchor="middle">ORIG.</text><line x1="320" y1="317" x2="320" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="320" y="303" font-size="10.5" fill="#6A655F" text-anchor="middle">+1</text><text x="20" y="354" font-size="9" fill="#6A655F"></text><rect x="400" y="284" width="330" height="56" rx="10" fill="#fff" stroke="#1a1612" stroke-width="1.2"/><rect x="412" y="310" width="306" height="5" rx="2.5" fill="#E2DAEB"/><line x1="424" y1="317" x2="424" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="424" y="303" font-size="10.5" fill="#6A655F" text-anchor="middle">−6</text><line x1="470" y1="317" x2="470" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="470" y="303" font-size="10.5" fill="#6A655F" text-anchor="middle">−5</text><line x1="516" y1="317" x2="516" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="516" y="303" font-size="10.5" fill="#6C4D8C" text-anchor="middle">−4</text><circle cx="516" cy="312" r="11" fill="#6C4D8C"/><circle cx="516" cy="312" r="11" fill="none" stroke="#fff" stroke-width="2"/><line x1="562" y1="317" x2="562" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="562" y="303" font-size="10.5" fill="#6A655F" text-anchor="middle">−3</text><line x1="608" y1="317" x2="608" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="608" y="303" font-size="10.5" fill="#6A655F" text-anchor="middle">−2</text><line x1="654" y1="317" x2="654" y2="323" stroke="#6A655F" stroke-width="1.3"/><text x="654" y="303" font-size="10.5" fill="#6A655F" text-anchor="middle">−1</text><line x1="700" y1="317" x2="700" y2="323" stroke="#1a1612" stroke-width="1.3"/><text x="700" y="303" font-size="10.5" fill="#1a1612" text-anchor="middle">ORIG.</text><text x="400" y="354" font-size="9" fill="#6A655F"></text><line x1="20" y1="392" x2="740" y2="392" stroke="#E2DAEB"/><text x="20" y="412" font-size="9.5" fill="#6A655F">LATE: the thumb roams five of the seven slots. The ribbon holds still through most of her moves, so the</text><text x="20" y="426" font-size="9.5" fill="#6A655F">world feels fixed. The cost is that she reaches the edge with one unseen node beyond it, so the far end</text><text x="20" y="440" font-size="9.5" fill="#6A655F">arrives without warning. Four slides to travel from the print to −6.</text><text x="20" y="466" font-size="9.5" fill="#6A655F">EARLY: the thumb roams three slots and two unseen nodes always sit beyond it, so she can see where she is</text><text x="20" y="480" font-size="9.5" fill="#6A655F">heading before she gets there. The cost is that the ribbon moves on more of her taps, which is the loss of</text><text x="20" y="494" font-size="9.5" fill="#6A655F">control you are asking about. Five slides to reach −6.</text><text x="20" y="512" font-size="10" font-weight="600" fill="#1a1612">Either way the desktop never slides, because all thirteen fit.</text></svg>