document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 to Dann, via the desk. Written against <span style=\"font-family:ui-monospace,monospace;font-size:.85em\">brief-to-design-drawer-as-a-path_r1_2026-09-10.md<\u002Fspan>, read in full, and the seven screenshots of the shipping drawer that arrived after the brief. Design system <span style=\"font-family:ui-monospace,monospace;font-size:.85em\">ilya-design-system-r2-3-standalone.html<\u002Fspan> verified: md5 <span style=\"font-family:ui-monospace,monospace;font-size:.85em\">3b0c9cf4c9f194245d6ab6914d7c52a8<\u002Fspan>, 1,318,529 bytes, computed this session. Every token in the frames is from that document or from the drawing's Plate 1; anything else is named in §6.<\u002Fp>\n<p style=\"margin:0;color:#4a4540\">Order, as the brief requires: what the screenshots settled (§0), the walkthrough (§1), the mockups drawn from it (§2, §3), one page of reasoning (§4), new strings (§5), and what I could not establish (§6). Nothing in a frame is hedged; alternatives get a sentence or a second frame.<\u002Fp>\n<\u002Fheader>\n\n<section style=\"margin-top:40px;max-width:78ch\">\n<h2 style=\"font-size:1.5rem;font-weight:600;margin:0 0 8px\">0. What the seven screenshots settled<\u002Fh2>\n<ul style=\"margin:0;padding-left:20px;display:grid;gap:6px\">\n<li><b>94 is the singer's syllable count.<\u002Fb> The expanded syllable line shows the whole poem syllabified, eight lines, and my count of it lands at 94 or 95 depending on one break. The fraction is therefore completable, and it is the strongest confidence device in the drawer. The earlier draft's worst-case (94 notes, never reached) is withdrawn.<\u002Fli>\n<li><b>Songs persist.<\u002Fb> Repertoire lists four songs with Rename, Delete, and New song. Evening one does not end on a failed step.<\u002Fli>\n<li><b>The syllable line already opens.<\u002Fb> The chevron expands it into a box of every syllable, placed in primary ink and unplaced in tertiary, with the current one boxed and <b>Start placement over<\u002Fb> as its ghost verb. It is already a station row in all but name. I build on it rather than inventing a door.<\u002Fli>\n<li><b>Corrections is a note editor with the lyric hands at its foot.<\u002Fb> Three rows of note tools (durations, step and octave, accidentals, Rest, Delete, Tie, Restore), then <span style=\"font-variant-caps:all-small-caps;letter-spacing:.12em\">lyric<\u002Fspan> 37 / 94 with Melisma and two pairs of arrows, then \"You have corrected 2 notes.\" The count already repeats in two places, which frame B keeps.<\u002Fli>\n<li><b>Three filled buttons, not two.<\u002Fb> Transcribe and fit (sage), Dictionary inside Analysis (sage), Re-calibrate (lavender). Text's Notation is seven toggles, all off in the screenshot, which is what \"Grayson defaults\" names.<\u002Fli>\n<li><b>The page already carries the voice status words.<\u002Fb> Its foot reads \"Captured: you sang it, and it read cleanly. Provisional: you sang it, but it read with less certainty. You can re-take it.\" So step 3.5's question is answered on the page, and the drawer owes only its half.<\u002Fli>\n<li><b>Still open.<\u002Fb> Whether the page is in view on a phone while the drawer is open. The desk screenshot shows them side by side; the phone screenshots show the drawer filling the width. Steps 1.3 and 3.4 turn on it.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<!-- ===================== WALKTHROUGH ===================== -->\n<section style=\"margin-top:48px;max-width:78ch\">\n<h2 style=\"font-size:1.5rem;font-weight:600;margin:0 0 4px\">1. The walkthrough, from the singer's chair<\u002Fh2>\n<p style=\"margin:0 0 18px;color:#4a4540\">Three evenings. At each step: what the singer sees, what they press, and how they know it worked before they move on. Where the honest answer is that they cannot know, the step says <b>FAILED<\u002Fb> and names the fix drawn in the frames, or NOT ESTABLISHED where the material does not settle it. Steps marked ▲ are the ones the frames were drawn to repair.<\u002Fp>\n\n<h3 style=\"font-size:1.1rem;font-weight:600;margin:24px 0 8px\">Evening one: a poem, nothing else<\u002Fh3>\n<div style=\"display:grid;gap:14px\">\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">1.1 Opening the drawer<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> Four bands stacked: Piece, Input, Text, Score markup. Today all four are open and equally loud; Piece presents five empty fields, Repertoire, and Export and import before the singer has anything to put in them.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Presses.<\u002Fb> Nothing yet. They look for where the poem goes.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> ▲ Not yet. The order of bands says Piece is first; the work says the poem is first. A singer who starts at the top types a title into a form that was going to fill itself from the score. <b>Fix in frame A:<\u002Fb> a band with nothing in it shows its band line alone; only Input is open on an empty drawer, and the poem box is the one thing that takes typing. The path is stated by what is open, not by a filled button, because before a poem there is nothing to press.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">1.2 Pasting the poem<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> Their words in serif, primary ink, in the box. Under it the receipt: <span style=\"font-variant-caps:all-small-caps;letter-spacing:.12em\">poem<\u002Fspan> · 8 lines · 37 words. <b>Transcribe and fit<\u002Fb> fills in sage.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> Yes. Eight lines is a count they can check by eye against the box, and it is the only check they need. The current drawer gives an honest answer here, and the frames keep it exactly.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">1.3 Pressing Transcribe and fit<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> On the desk, the page to the right fills with IPA over their words. On the phone, NOT ESTABLISHED whether the page is in view.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Presses.<\u002Fb> The one filled button.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> ▲ On the desk, yes: the result is beside the finger. On the phone, <b>FAILED<\u002Fb> if the page is behind the drawer: the singer presses a button and the only change in view is that button going from filled to outline, which also reads as \"the button broke\". The fix is not a sentence in the drawer (§4b forbids narrating the page). The fix is that on a phone the primary action of a step lands the singer on its result, and Back returns them to the drawer where they were. Every current single-column tool does this. Recorded as a proposed behaviour and not drawn, because the page is out of scope.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">1.4 Leaving for the night<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> Input shows its poem, its receipt, and <b>Transcribe and fit<\u002Fb> in outline. Text reads \"Grayson defaults\" on one line. Score markup is a band with no line, because there is nothing to say.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> The outline button says the transcription is done and can be redone. \"Grayson defaults\" tells them Text needs nothing tonight, which is right for a singer who does not know what a notation choice is. Repertoire holds the song, so it is there tomorrow.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"font-size:1.1rem;font-weight:600;margin:28px 0 8px\">Evening two: the score arrives, the words are joined and touched up<\u002Fh3>\n<div style=\"display:grid;gap:14px\">\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">2.1 Dropping the score<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> The poem where they left it. The drop zone under it. They drag the file over; on the phone, <b>Choose a file<\u002Fb>.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> The receipt gains a second row, <span style=\"font-variant-caps:all-small-caps;letter-spacing:.12em\">score<\u002Fspan> · the file's name. The name is theirs; they recognize it. Good, and kept.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">2.2 The moment after the drop (§4c)<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> Three things change at once. Piece, collapsed, now reads \"Without Sun, no. 1: Within Four Walls · Mussorgsky\" with its \"from score\" mark. The page (on the desk) shows their syllables under the notes. Under the poem the syllable line appears: their words, the first ones black, the rest grey, and \"37 / 94\".<\u002Fp>\n<p style=\"margin:4px 0\"><b>Where the eye lands.<\u002Fb> The syllable line, because it appears where the finger just was and it is the only thing that arrived with a number. Not the first bare note: the page carries no control, so sending a singer to the page with something to fix and nothing to press is a dead end. Not Piece: it filled itself, which is the point of \"from score\".<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> ▲ Mostly. The line says the join happened and the fraction says how much is left, and because 94 is their own syllables the fraction can complete. What the number does not say is what it counts: \"37 / 94\" beside a monospace \"37 words\" one row up reads as two counts of one thing. The frames add the word \"placed\" (new) so the fraction names its unit, and set the word count in the same sans as its siblings.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">2.3 Finding the hands<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> 37 / 94 and grey syllables. If they open the line, every syllable, the current one boxed, and <b>Start placement over<\u002Fb>. Two bands down, Score markup with Corrections.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Presses.<\u002Fb> ▲ Today, nothing tells them what. The desk's rule 2 says \"nothing filled, the count is the work\", and this is where the rule is naive: the count says <i>what<\u002Fi> is left and nothing says <i>how<\u002Fi>. The line is already the right object; what it lacks is a way through. In frame B the line's row is a station row that, opened, expands as today and also opens Corrections with the boxed syllable current, so the syllable and its hands are on screen together. One station, one name, reached from two places.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> When the boxed syllable in Input and the <span style=\"font-variant-caps:all-small-caps;letter-spacing:.12em\">lyric<\u002Fspan> count in Corrections agree, they know where they are. Whether tapping a syllable in the expanded line moves the current position is NOT ESTABLISHED; if it does, it is the whole answer to §4c question 4 and should be said somewhere a singer reads.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">2.4 Touching up, one syllable at a time<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> Corrections open. Today the eye meets three rows of note tools first (durations, step, octave, accidentals, Rest, Delete, Tie, Restore) and reaches the lyric hands (Melisma, two arrow pairs) below them. For a singer fixing a join, the note tools are the wrong tools at the top of the screen; they answer \"the engraving is wrong\", not \"my word is on the wrong note\".<\u002Fp>\n<p style=\"margin:4px 0\"><b>Presses.<\u002Fb> Melisma, or an arrow. Undo when wrong.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> ▲ Two signals I can vouch for: the count climbs (37, 38, 39) and the current syllable turns black in the line. That is the whole confidence mechanism for the hardest work in the tool, and it costs no new element. Two things weaken it today. The sentence \"You have corrected 2 notes.\" counts notes while the singer is counting syllables, two tallies of two things under one heading. And the lyric hands sit under 44 px of note tools that are, on a phone, a full screen of distraction between the boxed syllable and the arrow that moves it. <b>Fix in frame B2:<\u002Fb> while the join is unfinished the <span style=\"font-variant-caps:all-small-caps;letter-spacing:.12em\">lyric<\u002Fspan> group leads Corrections and the note tools follow; the sentence becomes the station's collapsed line, \"2 notes corrected · 37 / 94 placed\", so it states state rather than narrating. Whether a hand can change the count without the line changing is a code question; if it can, the singer has been lied to at one of the two.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">2.5 Arriving at 94 / 94<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> The line all black, \"94 / 94 placed\". Nothing grey in Input. Score markup's Voice station carries the one filled button.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> Yes. Arrival is a fraction with equal halves and a drawer whose only filled control has moved down one band. The verb for a first calibration is NOT ESTABLISHED; every screenshot shows \"Re-calibrate\" for a voice that exists. Frames draw \"Calibrate\", new.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"font-size:1.1rem;font-weight:600;margin:28px 0 8px\">Evening three: the voice is calibrated and the page is sung from<\u002Fh3>\n<div style=\"display:grid;gap:14px\">\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">3.1 Opening the calibration surface<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> The drawer turns over: the same band, Back at its left. Then the capture phase (microphone, fry guide, bar), NOT ESTABLISHED in its steps since the wizard and pacifier specifications were not attached. I walk only the summary.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> That the band kept its hue and its left edge is what tells them this is the same tool. Today the surface centres what the front sets flush left and swaps sentence case for small caps, which is the signature of \"a different program took over\". Fixed in frame D by grammar alone.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">3.2 Reading the summary<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> \"Voice · Dann\" as a station row. Ten vowel rows: symbol and name, a status word, two frequencies. Verbs only where there is something to do.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> The status word is the signal, and the page's own legend defines the same three words, so the two surfaces agree. The Hz figures mean nothing to a singer; I keep them one size down in secondary ink because they are the evidence a measurement happened. Ten identical Re-take pills, as today, say every row is equally doubtful, so the singer cannot tell which of the seven needs them.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">3.3 Re-taking one vowel<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> The lavender capture surface opens under the row they pressed. The rest dims and goes inert. The pressed pill is filled while its capture is open: one filled control, the one in progress.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> The surface folds and the word under their finger changes from Provisional to Captured, in place, without the table having left. Today the table is replaced by the capture screen and the singer re-finds their row on return. The desk's Plate 3 has this right; frame D keeps it and changes only the grammar around it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">3.4 Finish<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> Finish filled and last, Start over the ghost pill beside it, flush left.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> ▲ The drawer turns back and the Voice station reads \"Voice: Dann · 10 of 10\" (or 7 of 10 with estimates). On the desk the page has changed for their voice. On the phone, same as 1.3: <b>FAILED<\u002Fb> until the landing is ruled.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;padding:14px 18px\">\n<div style=\"font-weight:600\">3.5 Singing from the page<\u002Fdiv>\n<p style=\"margin:4px 0\"><b>Sees.<\u002Fb> The drawer at rest: four bands, four lines, nothing filled. They read the page, whose foot already says what Captured and Provisional mean.<\u002Fp>\n<p style=\"margin:4px 0\"><b>Knows it worked.<\u002Fb> A drawer with no filled button is a drawer asking nothing. \"Voice: Dann · 10 of 10\" is the drawer's half of \"is this forecast for my voice?\"; the page's legend is the other half.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== MOCKUPS: FRONT ===================== -->\n<section style=\"margin-top:56px\">\n<h2 style=\"font-size:1.5rem;font-weight:600;margin:0 0 4px\">2. The front side, three states, phone width<\u002Fh2>\n<p style=\"margin:0 0 18px;color:#4a4540;max-width:78ch\">390 px. One reflowing implementation; §2b is the same markup at 560 px. Bands are 40 px, white 0.7 rem 600 uppercase 0.12 em, hue by place: cobalt for Piece, sage for Input and Text, lavender for Score markup. Everything sits on the 18 px inset. A band with nothing to say shows its band line; a band with a state shows one line under it; an open band shows its content, and the content is its state.<\u002Fp>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start\">\n\n<figure style=\"margin:0\">\n<div style=\"font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#4a4540;margin-bottom:8px\">A · Empty<\u002Fdiv>\n<div style=\"width:390px;background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;overflow:hidden;font-size:.875rem;color:#1a1612\">\n  <div style=\"height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#5D74A0;color:#FFFFFF;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase\"><span>Piece<\u002Fspan><span style=\"font-weight:400;letter-spacing:0;font-size:.875rem;text-transform:none\">⌄<\u002Fspan><\u002Fdiv>\n  <div style=\"height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#6A785D;color:#FFFFFF;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase\"><span>Input<\u002Fspan><span style=\"font-weight:400;letter-spacing:0;font-size:.875rem;text-transform:none\">⌃<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:12px 18px 18px\">\n    <div style=\"border:1px solid #d4cec8;border-radius:4px;background:#FFFFFF;padding:12px 14px;min-height:132px;font-family:'Source Serif 4',Georgia,serif;font-size:1rem;line-height:1.5;color:#6A655F\">Type or paste the poem.<\u002Fdiv>\n    <div style=\"margin-top:12px;border:1px dashed #6A655F;border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start\">\n      <div style=\"color:#4a4540\">Drop the score here.<\u002Fdiv>\n      <span style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Choose a file<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#6A785D;color:#FFFFFF;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase\"><span>Text<\u002Fspan><span style=\"font-weight:400;letter-spacing:0;font-size:.875rem;text-transform:none\">⌄<\u002Fspan><\u002Fdiv>\n  <div style=\"min-height:44px;display:flex;align-items:center;padding:0 18px;color:#4a4540;border-bottom:1px solid #d4cec8\">Grayson defaults<\u002Fdiv>\n  <div style=\"height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#7F6D8D;color:#FFFFFF;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase\"><span>Score markup<\u002Fspan><span style=\"font-weight:400;letter-spacing:0;font-size:.875rem;text-transform:none\">⌄<\u002Fspan><\u002Fdiv>\n  <div style=\"height:12px\"><\u002Fdiv>\n<\u002Fdiv>\n<figcaption style=\"font-size:13px;color:#4a4540;margin:8px 0 0;max-width:390px\"><b style=\"color:#1a1612\">Nothing filled.<\u002Fb> The only open band is the one that takes the first thing. Piece and Score markup show their band and nothing under it, which says \"later\" without a word. Repertoire and Export and import are inside Piece when it opens, unchanged. The two placeholder sentences are <b style=\"color:#1a1612\">new<\u002Fb> strings; the current \"Drop the other kind here…\" presumes one kind is in. Both surfaces still take either kind first.<\u002Ffigcaption>\n<\u002Ffigure>\n\n<figure style=\"margin:0\">\n<div style=\"font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#4a4540;margin-bottom:8px\">B · Mid-work: poem and score in, syllables part placed<\u002Fdiv>\n<div style=\"width:390px;background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;overflow:hidden;font-size:.875rem;color:#1a1612\">\n  <div style=\"height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#5D74A0;color:#FFFFFF;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase\"><span>Piece<\u002Fspan><span style=\"font-weight:400;letter-spacing:0;font-size:.875rem;text-transform:none\">⌄<\u002Fspan><\u002Fdiv>\n  <div style=\"min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 18px;border-bottom:1px solid #d4cec8\"><span style=\"min-width:0\">Without Sun, no. 1: Within Four Walls · Mussorgsky<\u002Fspan><span style=\"color:#6A655F;font-style:italic;white-space:nowrap\">from score<\u002Fspan><\u002Fdiv>\n  <div style=\"height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#6A785D;color:#FFFFFF;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase\"><span>Input<\u002Fspan><span style=\"font-weight:400;letter-spacing:0;font-size:.875rem;text-transform:none\">⌃<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:12px 18px 0\">\n    <div style=\"border:1px solid #d4cec8;border-radius:4px;background:#FFFFFF;padding:12px 14px;font-family:'Source Serif 4',Georgia,serif;font-size:1rem;line-height:1.5;max-height:132px;overflow:hidden\">Комнатка тесная, тихая, милая,<br>Тень непроглядная, тень безответная,<br>Дума глубокая, песня унылая,<br>В бьющемся сердце надежда заветная;<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:auto 1fr auto auto;gap:0 14px;align-items:center;min-height:44px;padding:0 18px;border-bottom:1px solid #d4cec8;margin-top:8px\"><span style=\"font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#4a4540\">Poem<\u002Fspan><span>8 lines · 37 words<\u002Fspan><span style=\"color:#4a4540\">Clear<\u002Fspan><span style=\"color:#4a4540\">Replace<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:auto 1fr auto auto;gap:0 14px;align-items:center;min-height:44px;padding:0 18px;border-bottom:1px solid #d4cec8\"><span style=\"font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#4a4540\">Score<\u002Fspan><span style=\"white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0\">Mussorgsky - Sunless 01 - Within Four Walls.mxl<\u002Fspan><span style=\"color:#4a4540\">Clear<\u002Fspan><span style=\"color:#4a4540\">Replace<\u002Fspan><\u002Fdiv>\n  <div style=\"padding:10px 18px 12px;border-bottom:1px solid #d4cec8\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;min-height:24px\"><span style=\"color:#4a4540;font-variant-numeric:tabular-nums\">37 / 94 placed<\u002Fspan><span style=\"color:#6A655F\">⌄<\u002Fspan><\u002Fdiv>\n    <div style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem;line-height:1.8;margin-top:4px;word-spacing:.12em\"><span>Ком-нат-ка тес-на-я ти-ха-я ми-ла-я Тень неп-рог-ляд-на-я тень бе-зот-вет-на-я Ду-ма глу-бо-ка-я пес-ня у-ны-ла-я<\u002Fspan> <span style=\"color:#6A655F;background:#FFFFFF;outline:1px solid #8E7E9B;border-radius:2px;padding:1px 3px\">В<\u002Fspan> <span style=\"color:#6A655F\">бью-щем-ся серд-це на-деж-да за-вет-на-я …<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:12px 18px 18px\"><span style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid #6A655F;border-radius:999px;color:#4a4540;font-weight:600\">Transcribe and fit<\u002Fspan><\u002Fdiv>\n  <div style=\"height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#6A785D;color:#FFFFFF;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase\"><span>Text<\u002Fspan><span style=\"font-weight:400;letter-spacing:0;font-size:.875rem;text-t :'Source Serif 4',Georgia,serif;font-size:1rem\">[ɛ]<\u002Fspan> open-e<span style=\"display:block;font-size:.8rem;color:#4a4540\">Captured<\u002Fspan><\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">533 Hz<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">1421 Hz<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 62px 62px 88px;gap:0 8px;align-items:center;min-height:56px;padding:6px 18px;border-bottom:1px solid #d4cec8\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[a]<\u002Fspan> bright-a<span style=\"display:block;font-size:.8rem;color:#4a4540\">Captured<\u002Fspan><\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">748 Hz<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">1124 Hz<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 62px 62px 88px;gap:0 8px;align-items:center;min-height:56px;padding:6px 18px\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[o]<\u002Fspan> Russian-o<span style=\"display:block;font-size:.8rem;color:#4a4540\">Provisional<\u002Fspan><\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">440 Hz<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">787 Hz<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:#7F6D8D;border:1px solid #7F6D8D;border-radius:999px;color:#FFFFFF;font-weight:600\">Re-take<\u002Fspan><\u002Fdiv>\n  <div style=\"margin:0 18px 10px;background:#D8D0E0;border:1px solid #8E7E9B;border-radius:4px;padding:14px\">\n    <p style=\"margin:0 0 10px;font-family:'Source Serif 4',Georgia,serif;font-size:1.25rem;line-height:1.3\">Sing [o] as in «кот», through fry, and hold it.<\u002Fp>\n    <div style=\"height:6px;background:#FFFFFF;border-radius:3px;overflow:hidden\"><div style=\"width:45%;height:100%;background:#7F6D8D\"><\u002Fdiv><\u002Fdiv>\n    <p style=\"margin:8px 0 0;font-size:.8rem;color:#4a4540\">The fry guide and the bar are the existing capture phase, unchanged in copy and behaviour. Only where it opens changes.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"opacity:.45\">\n  <div style=\"display:grid;grid-template-columns:1fr 62px 62px 88px;gap:0 8px;align-items:center;min-height:56px;padding:6px 18px;border-bottom:1px solid #d4cec8;border-top:1px solid #d4cec8\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[u]<\u002Fspan> cardinal-u<span style=\"display:block;font-size:.8rem;color:#4a4540\">Provisional<\u002Fspan><\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">274 Hz<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">756 Hz<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Re-take<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 62px 62px 88px;gap:0 8px;align-items:center;min-height:56px;padding:6px 18px;border-bottom:1px solid #d4cec8;color:#6A655F\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[ɨ]<\u002Fspan> velar-i<span style=\"display:block;font-size:.8rem\">≈ Estimated<\u002Fspan><\u002Fspan><span style=\"font-size:.8rem;font-variant-numeric:tabular-nums\">1451 Hz<\u002Fspan><span style=\"font-size:.8rem;font-variant-numeric:tabular-nums\">1091 Hz<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Sing<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 62px 62px 88px;gap:0 8px;align-items:center;min-height:56px;padding:6px 18px;border-bottom:1px solid #d4cec8;color:#6A655F\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[ʌ]<\u002Fspan> turned-v<span style=\"display:block;font-size:.8rem\">≈ Estimated<\u002Fspan><\u002Fspan><span style=\"font-size:.8rem;font-variant-numeric:tabular-nums\">655 Hz<\u002Fspan><span style=\"font-size:.8rem;font-variant-numeric:tabular-nums\">1233 Hz<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;min-height:44px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Sing<\u002Fspan><\u002Fdiv>\n  <p style=\"margin:0;padding:10px 18px 0;font-size:.8rem;color:#4a4540\"><i>f<\u002Fi><sub>R1<\u002Fsub> and <i>f<\u002Fi><sub>R2<\u002Fsub> are your first and second resonances, measured from your own voice. Provisional means Ilya heard it but less clearly; Estimated means it is derived from your other vowels until you sing it.<\u002Fp>\n  <div style=\"display:flex;gap:10px;align-items:center;padding:16px 18px\"><span style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 18px;background:#7F6D8D;border-radius:999px;color:#FFFFFF;font-weight:600\">Finish<\u002Fspan><span style=\"display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Start over<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<figcaption style=\"font-size:13px;color:#4a4540;margin:8px 0 0;max-width:390px\"><b style=\"color:#1a1612\">The table never leaves.<\u002Fb> Seven of ten rows drawn; the other three follow the same shapes. The pressed pill is the one filled control while its capture is open, so Finish is not filled at the same time. Dimming is 0.45 opacity on inert rows: a state, not a colour, and the words stay legible. The capture surface takes <span style=\"font-family:ui-monospace,monospace;font-size:.85em\">surround-shane<\u002Fspan> #D8D0E0 as fill with Fit's graphical lavender as edge; whether the fry guide may sit on the pacifier's surround is a question for the pacifier specification. Provisional loses today's amber: amber is the countdown's colour by R19, and the word carries the state. The ⓘ on Russian-o is dropped; whatever it opens is NOT ESTABLISHED and an orphan control on one row breaks \"siblings behave identically\".<\u002Ffigcaption>\n<\u002Ffigure>\n\n<figure style=\"margin:0\">\n<div style=\"font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#4a4540;margin-bottom:8px\">D · same, desk, nothing pressed<\u002Fdiv>\n<div style=\"width:560px;background:#FAF8F5;border:1px solid #d4cec8;border-radius:4px;overflow:hidden;font-size:.875rem;color:#1a1612\">\n  <div style=\"height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#7F6D8D;color:#FFFFFF;font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase\"><span style=\"font-weight:400;letter-spacing:0;text-transform:none;font-size:.875rem\">← Back<\u002Fspan><span>Score markup<\u002Fspan><\u002Fdiv>\n  <div style=\"min-height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #d4cec8\"><span style=\"font-size:1rem\">Voice · Dann<\u002Fspan><span style=\"color:#6A655F\">⌄<\u002Fspan><\u002Fdiv>\n  <div style=\"min-height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #d4cec8\"><span style=\"font-size:1rem\">Voice characteristics <span style=\"color:#6A655F;font-size:.875rem\">· none added<\u002Fspan><\u002Fspan><span style=\"color:#6A655F\">⌄<\u002Fspan><\u002Fdiv>\n  <p style=\"margin:0;padding:10px 18px 6px;color:#4a4540\">7 of 10 vowels sampled. Review each reading and re-take anything uncertain before you finish.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:1fr 110px 90px 90px 96px;gap:0 8px;align-items:center;padding:6px 18px;border-bottom:1px solid  style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[ɛ]<\u002Fspan> open-e<\u002Fspan><span style=\"color:#4a4540\">Captured<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">533 Hz<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">1421 Hz<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 110px 90px 90px 96px;gap:0 8px;align-items:center;min-height:44px;padding:4px 18px;border-bottom:1px solid #d4cec8\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[a]<\u002Fspan> bright-a<\u002Fspan><span style=\"color:#4a4540\">Captured<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">748 Hz<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">1124 Hz<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 110px 90px 90px 96px;gap:0 8px;align-items:center;min-height:44px;padding:4px 18px;border-bottom:1px solid #d4cec8\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[ɑ]<\u002Fspan> dark-a<\u002Fspan><span style=\"color:#4a4540\">Provisional<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">655 Hz<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">1030 Hz<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;min-height:36px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Re-take<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 110px 90px 90px 96px;gap:0 8px;align-items:center;min-height:44px;padding:4px 18px;border-bottom:1px solid #d4cec8\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[o]<\u002Fspan> Russian-o<\u002Fspan><span style=\"color:#4a4540\">Provisional<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">440 Hz<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">787 Hz<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;min-height:36px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Re-take<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 110px 90px 90px 96px;gap:0 8px;align-items:center;min-height:44px;padding:4px 18px;border-bottom:1px solid #d4cec8\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[u]<\u002Fspan> cardinal-u<\u002Fspan><span style=\"color:#4a4540\">Provisional<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">274 Hz<\u002Fspan><span style=\"font-size:.8rem;color:#4a4540;font-variant-numeric:tabular-nums\">756 Hz<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;min-height:36px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Re-take<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 110px 90px 90px 96px;gap:0 8px;align-items:center;min-height:44px;padding:4px 18px;border-bottom:1px solid #d4cec8;color:#6A655F\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[ɨ]<\u002Fspan> velar-i<\u002Fspan><span>≈ Estimated<\u002Fspan><span style=\"font-size:.8rem;font-variant-numeric:tabular-nums\">1451 Hz<\u002Fspan><span style=\"font-size:.8rem;font-variant-numeric:tabular-nums\">1091 Hz<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;min-height:36px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Sing<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 110px 90px 90px 96px;gap:0 8px;align-items:center;min-height:44px;padding:4px 18px;border-bottom:1px solid #d4cec8;color:#6A655F\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[ɪ]<\u002Fspan> smallcaps-i<\u002Fspan><span>≈ Estimated<\u002Fspan><span style=\"font-size:.8rem;font-variant-numeric:tabular-nums\">398 Hz<\u002Fspan><span style=\"font-size:.8rem;font-variant-numeric:tabular-nums\">1716 Hz<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;min-height:36px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Sing<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 110px 90px 90px 96px;gap:0 8px;align-items:center;min-height:44px;padding:4px 18px;border-bottom:1px solid #d4cec8;color:#6A655F\"><span><span style=\"font-family:'Source Serif 4',Georgia,serif;font-size:1rem\">[ʌ]<\u002Fspan> turned-v<\u002Fspan><span>≈ Estimated<\u002Fspan><span style=\"font-size:.8rem;font-variant-numeric:tabular-nums\">655 Hz<\u002Fspan><span style=\"font-size:.8rem;font-variant-numeric:tabular-nums\">1233 Hz<\u002Fspan><span style=\"display:inline-flex;align-items:center;justify-content:center;min-height:36px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Sing<\u002Fspan><\u002Fdiv>\n  <p style=\"margin:0;padding:10px 18px 0;font-size:.8rem;color:#4a4540\"><i>f<\u002Fi><sub>R1<\u002Fsub> and <i>f<\u002Fi><sub>R2<\u002Fsub> are your first and second resonances, measured from your own voice. Provisional means Ilya heard it but less clearly; Estimated means it is derived from your other vowels until you sing it.<\u002Fp>\n  <div style=\"display:flex;gap:10px;align-items:center;padding:16px 18px\"><span style=\"display:inline-flex;align-items:center;min-height:36px;padding:0 18px;background:#7F6D8D;border-radius:999px;color:#FFFFFF;font-weight:600\">Finish<\u002Fspan><span style=\"display:inline-flex;align-items:center;min-height:36px;padding:0 18px;border:1px solid #6A655F;border-radius:999px;color:#4a4540\">Start over<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<figcaption style=\"font-size:13px;color:#4a4540;margin:8px 0 0;max-width:560px\">All ten rows. The one named divergence: at 560 px the status word takes its own column; at 390 px it sits under the vowel name. Same word, same ink, same row.<\u002Ffigcaption>\n<\u002Ffigure>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ===================== REASONING ===================== -->\n<section style=\"margin-top:56px;max-width:78ch\">\n<h2 style=\"font-size:1.5rem;font-weight:600;margin:0 0 12px\">4. One page of reasoning<\u002Fh2>\n\n<h3 style=\"font-size:1.1rem;font-weight:600;margin:20px 0 6px\">The patterns drawn on, and why they suit a stand<\u002Fh3>\n<p style=\"margin:0 0 10px\"><b>Collapsed steps that state their result.<\u002Fb> The single-column checkout is the most tested linear form on the web: a finished step collapses to one line of what you entered with a quiet verb to change it, and the open step is the one you are in. It works for a singer at a stand for the reason it works for a buyer at a till: the whole job reads without scrolling and you know where you stopped. This is the desk's rule 1, with one correction in §4b.<\u002Fp>\n<p style=\"margin:0 0 10px\"><b>One primary action per screen.<\u002Fb> Every platform guideline says it and few tools do it: one filled control names the next thing, and when nothing is next nothing is filled. A singer does not read chrome; they read weight. Three filled buttons at once (Transcribe and fit, Dictionary, Re-calibrate) is the drawer disagreeing with itself. Dictionary in Analysis is an inspector's verb, not a step on the path; it drops to outline in every state.<\u002Fp>\n<p style=\"margin:0 0 10px\"><b>Undo over confirm.<\u002Fb> Confirmation dialogs get clicked through and train the clicking. Ilya's join already has the right shape: act at once, undo per hand, Start placement over as the reset. I add no preview-then-accept step for the join (§4c question 1), because its answer is always yes and the singer pays a tap for nothing.<\u002Fp>\n<p style=\"margin:0 0 10px\"><b>A completable fraction, not a bar.<\u002Fb> \"37 / 94 placed\" is progress the singer can verify against their own poem, because 94 is their syllables; a bar is progress they have to trust. This is also the answer to §4c question 2: the modern vocabulary for \"yours to finish\" is a count of what remains plus muted ink on the items, and no mark on each item. Tax software and onboarding both settled on it.<\u002Fp>\n<p style=\"margin:0 0 10px\"><b>Expansion in place, with the rest inert.<\u002Fb> A row that opens under your finger and closes when done is the settings-list pattern every phone owner knows, and it is what keeps the table from leaving in frame D. Dimming is how the pattern says \"this first\".<\u002Fp>\n<p style=\"margin:0 0 10px\"><b>Tools ordered by the job in hand.<\u002Fb> A context-sensitive toolbar shows the tools for the current task first; the others are present and later. Frame B2 applies that within Corrections without moving anything across a band.<\u002Fp>\n\n<h3 style=\"font-size:1.1rem;font-weight:600;margin:20px 0 6px\">4b. Where the desk's three rules are wrong or naive<\u002Fh3>\n<p style=\"margin:0 0 10px\"><b>Rule 1, \"every stage states its state, open or collapsed.\"<\u002Fb> Open and stating its state is a duplicate: Piece open shows the title in a field, and a line under the band saying the title says it twice. The state line is the collapsed form. Open, the content is the state, and the receipts (8 lines · 37 words) survive both ways only because they are apparatus about the content rather than a copy of it.<\u002Fp>\n<p style=\"margin:0 0 10px\"><b>Rule 2, \"exactly one thing is next, and only it is filled.\"<\u002Fb> Right in principle, naive twice. First, \"score in, syllables waiting: nothing filled, the count is the work\" goes quiet at the hardest step in the tool. A count says what, not how, and a singer with 57 syllables to place and the lyric hands buried under a note editor is a singer who closes the lid. The fix is not a filled button (Corrections is a station, not an action) but a door where the count is, and the right tools first when the door opens. Second, the rules name no <i>stale<\u002Fi> state. The singer edits the poem after transcribing, and Transcribe and fit must fill again; the singer changes a Notation toggle, same. Done is not permanent, and the drawer must show it re-fill or the singer sings from a page that no longer matches their words. That is a fourth state, and the one most likely to cost a performance.<\u002Fp>\n<p style=\"margin:0 0 10px\"><b>Rule 3, \"the singer's own content stays black.\"<\u002Fb> The shipping line already breaks it: unplaced syllables are the singer's content and they are grey. The honest version is \"the singer's content stays black once it is placed; until then its state is shown in tertiary ink and named by the count.\" That names the WCAG 1.4.1 risk squarely: a single grey syllable carries its state by hue alone, and the count beside it is the word. Whether a per-syllable word is owed as well is a ruling I ask for, not a pixel I hedged.<\u002Fp>\n<p style=\"margin:0 0 10px\"><b>The thesis itself.<\u002Fb> \"The drawer is a path, top to bottom\" is true of Input, Text, and Score markup and false of Piece, which is a receipt that fills itself from the score plus a song list. Putting a receipt first on the path is what makes the empty drawer feel like a form. Frame A leaves Piece collapsed until something is in it; the order does not change, the emphasis does.<\u002Fp>\n\n<h3 style=\"font-size:1.1rem;font-weight:600;margin:20px 0 6px\">4c. The moment the score arrives, answered<\u002Fh3>\n<p style=\"margin:0 0 6px\"><b>1.<\u002Fb> \"It happens the moment you drop, and here is what is left\" is right, now that the count is known to complete. A staged reveal is theatre; an accept step is a tap that always says yes. Seating onto the file's own syllable slots when the file has an underlay is right and I have no better device; it is \"from score\" applied to shape instead of words.<\u002Fp>\n<p style=\"margin:0 0 6px\"><b>2.<\u002Fb> Count of remaining plus tertiary ink on the unplaced syllables in the line. Nothing on the page, nothing on every row.<\u002Fp>\n<p style=\"margin:0 0 6px\"><b>3.<\u002Fb> The syllable line under the poem. It is where the finger was and where the number is.<\u002Fp>\n<p style=\"margin:0 0 6px\"><b>4.<\u002Fb> The hands stay in Corrections and the line is the door to them; within Corrections the lyric hands lead while the join is unfinished (frame B2). Moving the hands beside the poem would put Score markup's tools under Input's band, which breaks \"hue names place\" for a convenience the door and the reorder already give. The distance that costs the singer today is not two bands; it is three rows of note tools between the syllable and its arrow, and that is the distance I close.<\u002Fp>\n<p style=\"margin:0 0 6px\"><b>5.<\u002Fb> Remove: the drop-zone sentence once both kinds are in (it narrates); <b>Choose a file<\u002Fb> once a score is in (Replace is the verb); the filled Re-calibrate from the drawer's face at rest; the monospace on \"37 words\" where its siblings are sans; the METADATA label on the Piece band, which names the band a second time; the ⓘ on one vowel row; \"You have corrected 2 notes.\" as a sentence, its fact kept as state. Every item is a subtraction.<\u002Fp>\n\n<h3 style=\"font-size:1.1rem;font-weight:600;margin:20px 0 6px\">4d. What §5 is costing the singer, stated and left unbuilt<\u002Fh3>\n<p style=\"margin:0 0 6px\"><b>Nothing floats.<\u002Fb> On a phone the one filled button is wherever the drawer scrolled to. A pinned action row would let a singer at a stand press without hunting. Not built.<\u002Fp>\n<p style=\"margin:0 0 6px\"><b>No control on the paper.<\u002Fb> Fixing a melisma where you see it is the most direct correction there is; every hand works on a proxy line instead. The line is a good proxy. It is still a proxy. Not built.<\u002Fp>\n<p style=\"margin:0 0 6px\"><b>No renaming.<\u002Fb> <b>Transcribe and fit<\u002Fb> promises a fit to a singer with no score and no voice, and <b>Re-calibrate<\u002Fb> is the only calibration verb that ships, so a first-time singer is offered a redo. Both stand; both are named.<\u002Fp>\n<p style=\"margin:0 0 6px\"><b>Parity.<\u002Fb> It forces a five-column table onto 390 px. The reflow in frame D is the cost paid; it is small.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"margin-top:48px;max-width:78ch\">\n<h2 style=\"font-size:1.5rem;font-weight:600;margin:0 0 8px\">5. Strings that are new, for ruling and French<\u002Fh2>\n<p style=\"margin:0 0 10px;color:#4a4540\">Every string in the frames not seen in the screenshots or the drawing. Nothing existing is renamed. Coined is mine; adopted is the desk's.<\u002Fp>\n<ul style=\"margin:0;padding-left:20px;display:grid;gap:4px\">\n<li><b>placed<\u002Fb>, as in \"37 / 94 placed\". Coined. It makes the fraction say what it counts.<\u002Fli>\n<li><b>Calibrate<\u002Fb>, the verb for a first calibration. Coined unless one exists.<\u002Fli>\n<li><b>Sing<\u002Fb>, the row verb on Estimated rows. Adopted from the desk's Plate 2, with its French adopted from the button it replaces.<\u002Fli>\n<li><b>Type or paste the poem.<\u002Fb> and <b>Drop the score here.<\u002Fb> Coined, empty state only.<\u002Fli>\n<li><b>2 notes corrected<\u002Fb>, the state form of \"You have corrected 2 notes.\" Coined as a recast; the fact is the existing one.<\u002Fli>\n<li><b>Note<\u002Fb>, the group label over the note tools in Corrections, pairing with the existing <span style=\"font-variant-caps:all-small-caps;letter-spacing:.12em\">lyric<\u002Fspan>. Coined, and the one I am least sure of.<\u002Fli>\n<li><b>2 of 7 changed<\u002Fb>, the Text line when any Notation toggle is on. Coined.<\u002Fli>\n<li><b>Voice · Dann<\u002Fb>, <b>Voice characteristics · none added<\u002Fb>, and the two caption sentences under the table. Adopted from the desk's Plate 2.<\u002Fli>\n<li><b>Voice: Dann · 10 of 10<\u002Fb>. Composed from existing parts; \"7 of 10\" exists.<\u002Fli>\n<li><b>Grayson defaults<\u002Fb>. Adopted from the brief §4.<\u002Fli>\n<\u002Ful>\n<\u002Fsection>\n\n<section style=\"margin-top:48px;max-width:78ch\">\n<h2 style=\"font-size:1.5rem;font-weight:600;margin:0 0 8px\">6. What I could not establish<\u002Fh2>\n<p style=\"margin:0 0 10px;color:#4a4540\">Everything the frames assume. Each is a gap in what I was given, not a decision made quietly. Three items from the earlier draft (the meaning of 94, persistence, what the line's chevron opens) were settled by the screenshots and are gone from this list.<\u002Fp>\n<ol style=\"margin:0;padding-left:20px;display:grid;gap:6px\">\n<li><b>Phone layout of page and drawer.<\u002Fb> Whether the page is in view while the drawer is open on a phone. Steps 1.3 and 3.4 fail or pass on this alone.<\u002Fli>\n<li><b>Whether tapping a syllable in the expanded line moves the current position.<\u002Fb> If it does, frame B's door is already half built and step 2.3 improves.<\u002Fli>\n<li><b>Whether a lyric hand can change the count without the line updating,<\u002Fb> or the reverse. Step 2.4 rests on the two agreeing.<\u002Fli>\n<li><b>The ← → row above the note tools<\u002Fb> in Corrections: what it moves between. Left in place, undrawn.<\u002Fli>\n<li><b>The capture phase<\u002Fb>: microphone request, fry guide steps, what the summary shows meanwhile. Wizard and pacifier specifications not attached.<\u002Fli>\n<li><b>The first-calibration verb<\u002Fb> and what the Voice station shows with no voice. Drawn as \"Calibrate\", ghost.<\u002Fli>\n<li><b>What the ⓘ on Russian-o opens.<\u002Fb> Dropped from frame D as an orphan; if it carries something the singer needs, it belongs on every row or in the caption.<\u002Fli>\n<li><b>The two 44 px exemptions.<\u002Fb> Not named in the brief. I created none, and cannot confirm the text verbs Clear, Replace, Revert, Reset, Rename, and Delete are covered by them.<\u002Fli>\n<li><b>The faces behind <span style=\"font-family:ui-monospace,monospace;font-size:.85em\">--font-sans<\u002Fspan> and <span style=\"font-family:ui-monospace,monospace;font-size:.85em\">--font-serif<\u002Fspan>.<\u002Fb> The design system names tokens, not faces. Frames use Source Sans 3 and Source Serif 4 as the desk's drawing does.<\u002Fli>\n<li><b>Whether the fry guide may sit on <span style=\"font-family:ui-monospace,monospace;font-size:.85em\">surround-shane<\u002Fspan>.<\u002Fb> The design system forbids the pacifier interior values outside Shane; the surround itself is not listed among them, and I used it. If it is also barred, the capture surface takes <span style=\"font-family:ui-monospace,monospace;font-size:.85em\">--drawer-bg<\u002Fspan> with the lavender edge alone.<\u002Fli>\n<li><b>The stale state.<\u002Fb> Whether the tree already tracks \"poem edited since last transcription\" or \"toggle changed since last transcription\". The frames assume Transcribe and fit re-fills on either; if nothing tracks it, that is a build item before a design one.<\u002Fli>\n<li><b>The exact syllable count.<\u002Fb> My count of the expanded line lands at 95; the tool says 94. One break differs somewhere and I did not find it. The frames use the tool's number.<\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<\u002Fmain>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
