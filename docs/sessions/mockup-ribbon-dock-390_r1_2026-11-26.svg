<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="Source Sans 3, system-ui, sans-serif"><rect width="860" height="640" fill="#F0EBE0"/><text x="20" y="24" font-size="13" font-weight="600" fill="#1a1612">The dock at 390 px. Thirteen nodes at the 44 px touch floor need 572 px.</text><text x="20" y="56" font-size="11" font-weight="600" fill="#4a4540">C · Jog: the thumb stays centred, the ribbon slides under it</text><rect x="20" y="68" width="390" height="120" rx="14" fill="#fff" stroke="#1a1612" stroke-width="1.4"/><text x="20" y="62" font-size="9" fill="#6A655F">390 px</text><text x="215" y="94" font-size="13" font-weight="600" fill="#1a1612" text-anchor="middle">Down a whole tone · C major</text><rect x="30" y="121" width="370" height="6" rx="3" fill="#E2DAEB"/><line x1="50" y1="130" x2="50" y2="136" stroke="#6A655F" stroke-width="1.5"/><text x="50" y="112" font-size="11" fill="#6A655F" text-anchor="middle">−4</text><text x="50" y="150" font-size="9" fill="#6A655F" text-anchor="middle">M3</text><line x1="103" y1="130" x2="103" y2="136" stroke="#6A655F" stroke-width="1.5"/><text x="103" y="112" font-size="11" fill="#6A655F" text-anchor="middle">−3</text><text x="103" y="150" font-size="9" fill="#6A655F" text-anchor="middle">m3</text><line x1="156" y1="130" x2="156" y2="136" stroke="#6A655F" stroke-width="1.5"/><text x="156" y="112" font-size="11" fill="#6C4D8C" text-anchor="middle">−2</text><text x="156" y="150" font-size="9" fill="#6A655F" text-anchor="middle">M2</text><line x1="209" y1="130" x2="209" y2="136" stroke="#6A655F" stroke-width="1.5"/><text x="209" y="112" font-size="11" fill="#6A655F" text-anchor="middle">−1</text><text x="209" y="150" font-size="9" fill="#6A655F" text-anchor="middle">m2</text><line x1="262" y1="130" x2="262" y2="136" stroke="#1a1612" stroke-width="1.5"/><text x="262" y="112" font-size="11" fill="#1a1612" text-anchor="middle">0</text><text x="262" y="150" font-size="9" fill="#6A655F" text-anchor="middle">ORIG.</text><line x1="315" y1="130" x2="315" y2="136" stroke="#6A655F" stroke-width="1.5"/><text x="315" y="112" font-size="11" fill="#6A655F" text-anchor="middle">+1</text><text x="315" y="150" font-size="9" fill="#6A655F" text-anchor="middle">m2</text><line x1="368" y1="130" x2="368" y2="136" stroke="#6A655F" stroke-width="1.5"/><text x="368" y="112" font-size="11" fill="#6A655F" text-anchor="middle">+2</text><text x="368" y="150" font-size="9" fill="#6A655F" text-anchor="middle">M2</text><circle cx="156" cy="124" r="13" fill="#6C4D8C"/><circle cx="156" cy="124" r="13" fill="none" stroke="#fff" stroke-width="2"/><text x="30" y="178" font-size="9.5" fill="#6A655F">Seven nodes visible at 53 px. Drag the ribbon, not the thumb. Native to touch, and nothing is ever off-target.</text><text x="30" y="191" font-size="9.5" fill="#6A655F">Cost: she cannot see −6 and +6 at once, so the full span is felt rather than seen.</text><text x="440" y="56" font-size="11" font-weight="600" fill="#4a4540">D · Two rows, all thirteen visible</text><rect x="440" y="68" width="390" height="120" rx="14" fill="#fff" stroke="#1a1612" stroke-width="1.4"/><text x="635" y="94" font-size="13" font-weight="600" fill="#1a1612" text-anchor="middle">Down a whole tone · C major</text><rect x="450" y="118" width="370" height="5" rx="2.5" fill="#E2DAEB"/><text x="466" y="112" font-size="11" fill="#6A655F" text-anchor="middle">−6</text><text x="466" y="136" font-size="8.5" fill="#6A655F" text-anchor="middle">TT</text><text x="518" y="112" font-size="11" fill="#6A655F" text-anchor="middle">−5</text><text x="518" y="136" font-size="8.5" fill="#6A655F" text-anchor="middle">P4</text><text x="570" y="112" font-size="11" fill="#6A655F" text-anchor="middle">−4</text><text x="570" y="136" font-size="8.5" fill="#6A655F" text-anchor="middle">M3</text><text x="622" y="112" font-size="11" fill="#6A655F" text-anchor="middle">−3</text><text x="622" y="136" font-size="8.5" fill="#6A655F" text-anchor="middle">m3</text><text x="674" y="112" font-size="11" fill="#6C4D8C" text-anchor="middle">−2</text><text x="674" y="136" font-size="8.5" fill="#6A655F" text-anchor="middle">M2</text><text x="726" y="112" font-size="11" fill="#6A655F" text-anchor="middle">−1</text><text x="726" y="136" font-size="8.5" fill="#6A655F" text-anchor="middle">m2</text><text x="778" y="112" font-size="11" fill="#1a1612" text-anchor="middle">0</text><text x="778" y="136" font-size="8.5" fill="#6A655F" text-anchor="middle">ORIG.</text><circle cx="674" cy="120" r="13" fill="#6C4D8C"/><circle cx="674" cy="120" r="13" fill="none" stroke="#fff" stroke-width="2"/><rect x="450" y="156" width="310" height="5" rx="2.5" fill="#E2DAEB"/><text x="466" y="150" font-size="11" fill="#6A655F" text-anchor="middle">+1</text><text x="466" y="174" font-size="8.5" fill="#6A655F" text-anchor="middle">m2</text><text x="518" y="150" font-size="11" fill="#6A655F" text-anchor="middle">+2</text><text x="518" y="174" font-size="8.5" fill="#6A655F" text-anchor="middle">M2</text><text x="570" y="150" font-size="11" fill="#6A655F" text-anchor="middle">+3</text><text x="570" y="174" font-size="8.5" fill="#6A655F" text-anchor="middle">m3</text><text x="622" y="150" font-size="11" fill="#6A655F" text-anchor="middle">+4</text><text x="622" y="174" font-size="8.5" fill="#6A655F" text-anchor="middle">M3</text><text x="674" y="150" font-size="11" fill="#6A655F" text-anchor="middle">+5</text><text x="674" y="174" font-size="8.5" fill="#6A655F" text-anchor="middle">P4</text><text x="726" y="150" font-size="11" fill="#6A655F" text-anchor="middle">+6</text><text x="726" y="174" font-size="8.5" fill="#6A655F" text-anchor="middle">TT</text><text x="450" y="206" font-size="9.5" fill="#6A655F">All thirteen on screen at 52 px. Cost: it stops looking like one slider, and a drag across the break is two gestures.</text><text x="20" y="246" font-size="11" font-weight="600" fill="#4a4540">E · Vertical, where up really is up</text><rect x="20" y="258" width="390" height="360" rx="14" fill="#fff" stroke="#1a1612" stroke-width="1.4"/><text x="215" y="284" font-size="13" font-weight="600" fill="#1a1612" text-anchor="middle">Down a whole tone · C major</text><rect x="117" y="300" width="6" height="300" rx="3" fill="#E2DAEB"/><line x1="126" y1="308" x2="132" y2="308" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="312" font-size="11" fill="#6A655F" text-anchor="end">+6</text><text x="138" y="312" font-size="9" fill="#6A655F">TT</text><line x1="126" y1="331" x2="132" y2="331" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="335" font-size="11" fill="#6A655F" text-anchor="end">+5</text><text x="138" y="335" font-size="9" fill="#6A655F">P4</text><line x1="126" y1="354" x2="132" y2="354" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="358" font-size="11" fill="#6A655F" text-anchor="end">+4</text><text x="138" y="358" font-size="9" fill="#6A655F">M3</text><line x1="126" y1="377" x2="132" y2="377" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="381" font-size="11" fill="#6A655F" text-anchor="end">+3</text><text x="138" y="381" font-size="9" fill="#6A655F">m3</text><line x1="126" y1="400" x2="132" y2="400" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="404" font-size="11" fill="#6A655F" text-anchor="end">+2</text><text x="138" y="404" font-size="9" fill="#6A655F">M2</text><line x1="126" y1="423" x2="132" y2="423" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="427" font-size="11" fill="#6A655F" text-anchor="end">+1</text><text x="138" y="427" font-size="9" fill="#6A655F">m2</text><line x1="126" y1="446" x2="132" y2="446" stroke="#1a1612" stroke-width="1.5"/><text x="108" y="450" font-size="11" fill="#1a1612" text-anchor="end">0</text><text x="138" y="450" font-size="9" fill="#6A655F">ORIG.</text><line x1="126" y1="469" x2="132" y2="469" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="473" font-size="11" fill="#6A655F" text-anchor="end">−1</text><text x="138" y="473" font-size="9" fill="#6A655F">m2</text><line x1="126" y1="492" x2="132" y2="492" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="496" font-size="11" fill="#6C4D8C" text-anchor="end">−2</text><text x="138" y="496" font-size="9" fill="#6A655F">M2</text><line x1="126" y1="515" x2="132" y2="515" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="519" font-size="11" fill="#6A655F" text-anchor="end">−3</text><text x="138" y="519" font-size="9" fill="#6A655F">m3</text><line x1="126" y1="538" x2="132" y2="538" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="542" font-size="11" fill="#6A655F" text-anchor="end">−4</text><text x="138" y="542" font-size="9" fill="#6A655F">M3</text><line x1="126" y1="561" x2="132" y2="561" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="565" font-size="11" fill="#6A655F" text-anchor="end">−5</text><text x="138" y="565" font-size="9" fill="#6A655F">P4</text><line x1="126" y1="584" x2="132" y2="584" stroke="#6A655F" stroke-width="1.5"/><text x="108" y="588" font-size="11" fill="#6A655F" text-anchor="end">−6</text><text x="138" y="588" font-size="9" fill="#6A655F">TT</text><circle cx="120" cy="492" r="13" fill="#6C4D8C"/><circle cx="120" cy="492" r="13" fill="none" stroke="#fff" stroke-width="2"/><text x="30" y="612" font-size="9.5" fill="#6A655F">Thirteen at 23 px apart in a 300 px column, one thumb to drag. Pitch rises upward, which is what the staff does.</text><text x="440" y="300" font-size="10.5" font-weight="600" fill="#1a1612">What each costs</text><text x="440" y="322" font-size="9.5" fill="#6A655F">C keeps one ribbon and one gesture, and hides the ends.</text><text x="440" y="337" font-size="9.5" fill="#6A655F">D shows everything and breaks the slider in half.</text><text x="440" y="352" font-size="9.5" fill="#6A655F">E shows everything, keeps one gesture, and maps pitch to the</text><text x="440" y="367" font-size="9.5" fill="#6A655F">    axis a musician already reads vertically.</text><text x="440" y="382" font-size="9.5" fill="#6A655F"></text><text x="440" y="397" font-size="9.5" fill="#6A655F">E's row spacing is 23 px, under the 44 px touch floor, but the</text><text x="440" y="412" font-size="9.5" fill="#6A655F">target is the thumb and the track, not each node, so the floor</text><text x="440" y="427" font-size="9.5" fill="#6A655F">applies to the thumb alone. That is the thing to check on a</text><text x="440" y="442" font-size="9.5" fill="#6A655F">real phone before ruling.</text><text x="440" y="457" font-size="9.5" fill="#6A655F"></text><text x="440" y="472" font-size="9.5" fill="#6A655F">The desktop ribbon is unaffected by all three.</text></svg>