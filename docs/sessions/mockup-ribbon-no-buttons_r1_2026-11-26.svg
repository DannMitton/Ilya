<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" font-family="Source Sans 3, system-ui, sans-serif"><rect width="700" height="500" fill="#F0EBE0"/><text x="16" y="22" font-size="13" font-weight="600" fill="#1a1612">No standing buttons: the ribbon is the control, chrome arrives after the touch</text><text x="16" y="40" font-size="10.5" font-weight="600" fill="#4a4540">1 · At rest, sitting on the printed key</text><rect x="16" y="48" width="660" height="112" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="74" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">D major</text><text x="47" y="107" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="128" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="107" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="128" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="107" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="128" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="107" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="128" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="239" y="107" font-size="12" fill="#6A655F" text-anchor="middle">−2</text><text x="239" y="128" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="107" font-size="12" fill="#6A655F" text-anchor="middle">−1</text><text x="287" y="128" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><rect x="318" y="88" width="34" height="46" rx="6" fill="#e8e4dc"/><circle cx="335" cy="103" r="15" fill="#6C4D8C"/><text x="335" y="107" font-size="12" fill="#fff" text-anchor="middle">0</text><text x="335" y="128" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="107" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="128" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="107" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="128" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="107" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="128" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="107" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="128" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="107" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="128" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="107" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="128" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="177" font-size="10" fill="#6A655F">Nothing but the ribbon. No Cancel, no Use this key, no decision being asked of her.</text><text x="16" y="192" font-size="10.5" font-weight="600" fill="#4a4540">2 · She taps −2. The paper redraws at once.</text><rect x="16" y="200" width="660" height="112" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="226" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a whole tone · C major</text><text x="47" y="259" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="280" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="259" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="280" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="259" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="280" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="259" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="280" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><circle cx="239" cy="255" r="15" fill="#6C4D8C"/><text x="239" y="259" font-size="12" fill="#fff" text-anchor="middle">−2</text><text x="239" y="280" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="259" font-size="12" fill="#6A655F" text-anchor="middle">−1</text><text x="287" y="280" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><rect x="318" y="240" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="259" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="280" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="259" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="280" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="259" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="280" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="259" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="280" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="259" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="280" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="259" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="280" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="259" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="280" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><rect x="476" y="272" width="118" height="28" rx="14" fill="#6C4D8C"/><text x="535" y="290" font-size="11" fill="#fff" text-anchor="middle">Keep C major</text><text x="612" y="290" font-size="11" fill="#6A655F">Undo</text><text x="16" y="329" font-size="10" fill="#6A655F">The verification appears only now, because only now is there something to verify. Undo returns to D.</text><text x="16" y="344" font-size="10.5" font-weight="600" fill="#4a4540">3 · She taps Keep. Chrome leaves again.</text><rect x="16" y="352" width="660" height="112" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="378" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a whole tone · C major</text><text x="47" y="411" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="432" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="411" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="432" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="411" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="432" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="411" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="432" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><circle cx="239" cy="407" r="15" fill="#6C4D8C"/><text x="239" y="411" font-size="12" fill="#fff" text-anchor="middle">−2</text><text x="239" y="432" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="411" font-size="12" fill="#6A655F" text-anchor="middle">−1</text><text x="287" y="432" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><rect x="318" y="392" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="411" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="432" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="411" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="432" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="411" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="432" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="411" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="432" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="411" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="432" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="411" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="432" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="411" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="432" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="481" font-size="10" fill="#6A655F">Back to a bare ribbon, now centred on her choice. She can keep nudging; each new tap brings the chrome back.</text><text x="16" y="490" font-size="10.5" font-weight="600" fill="#1a1612">Open: with no Cancel, what does tapping away from the ribbon do — keep her change, or drop it?</text></svg>