font-size="9" font-weight="700" fill="#6C4D8C" text-anchor="middle">ré♭</text><text x="287" y="168" font-size="9" fill="#6A655F" text-anchor="middle">/</text><text x="300" y="168" font-size="9" fill="#6A655F" text-anchor="middle" opacity="0.55">do♯</text><text x="16" y="217" font-size="10" fill="#6A655F">French names the notes do, ré, mi (`watch.key.letter.*`, i18n.ts:2340-2346). With the glyph, the pair fits as the English does.</text><text x="16" y="240" font-size="10.5" font-weight="600" fill="#4a4540">Avec le mot — ne tient pas</text><rect x="16" y="248" width="660" height="152" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="274" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Un demi-ton plus bas · ré bémol majeur</text><text x="47" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−6</text><text x="95" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−5</text><text x="143" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−4</text><text x="191" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−3</text><text x="239" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−2</text><text x="287" y="302" font-size="12" font-weight="700" fill="#6C4D8C" text-anchor="middle">−1</text><text x="335" y="302" font-size="12" font-weight="400" fill="#1a1612" text-anchor="middle">0</text><text x="383" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+1</text><text x="431" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+2</text><text x="479" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+3</text><text x="527" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+4</text><text x="575" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+5</text><text x="623" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+6</text><rect x="47" y="321" width="576" height="6" rx="3" fill="#E2DAEB"/><rect x="287" y="321" width="48" height="6" rx="3" fill="#6C4D8C" opacity="0.55"/><circle cx="47" cy="324" r="2.6" fill="#9F85BC"/><circle cx="95" cy="324" r="2.6" fill="#9F85BC"/><circle cx="143" cy="324" r="2.6" fill="#9F85BC"/><circle cx="191" cy="324" r="2.6" fill="#9F85BC"/><circle cx="239" cy="324" r="2.6" fill="#9F85BC"/><circle cx="287" cy="324" r="2.6" fill="#fff"/><circle cx="335" cy="324" r="3.8" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="383" cy="324" r="2.6" fill="#9F85BC"/><circle cx="431" cy="324" r="2.6" fill="#9F85BC"/><circle cx="479" cy="324" r="2.6" fill="#9F85BC"/><circle cx="527" cy="324" r="2.6" fill="#9F85BC"/><circle cx="575" cy="324" r="2.6" fill="#9F85BC"/><circle cx="623" cy="324" r="2.6" fill="#9F85BC"/><circle cx="287" cy="324" r="11" fill="#6C4D8C"/><circle cx="287" cy="324" r="11" fill="none" stroke="#fff" stroke-width="2"/><text x="47" y="352" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="352" font-size="10" fill="#6A655F" text-anchor="middle">4J</text><text x="143" y="352" font-size="10" fill="#6A655F" text-anchor="middle">3M</text><text x="191" y="352" font-size="10" fill="#6A655F" text-anchor="middle">3m</text><text x="239" y="352" font-size="10" fill="#6A655F" text-anchor="middle">2M</text><text x="287" y="352" font-size="10" fill="#6A655F" text-anchor="middle">2m</text><text x="335" y="352" font-size="10" fill="#6A655F" text-anchor="middle">ORIG.</text><text x="383" y="352" font-size="10" fill="#6A655F" text-anchor="middle">2m</text><text x="431" y="352" font-size="10" fill="#6A655F" text-anchor="middle">2M</text><text x="479" y="352" font-size="10" fill="#6A655F" text-anchor="middle">3m</text><text x="527" y="352" font-size="10" fill="#6A655F" text-anchor="middle">3M</text><text x="575" y="352" font-size="10" fill="#6A655F" text-anchor="middle">4J</text><text x="623" y="352" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><rect x="227" y="357" width="24" height="16" fill="#6C4D8C" opacity="0.10"/><rect x="323" y="357" width="24" height="16" fill="#6C4D8C" opacity="0.10"/><text x="253" y="368" font-size="9" font-weight="700" fill="#6C4D8C" text-anchor="middle">ré bémol</text><text x="287" y="368" font-size="9" fill="#6A655F" text-anchor="middle">/</text><text x="321" y="368" font-size="9" fill="#6A655F" text-anchor="middle" opacity="0.55">do dièse</text><text x="287" y="383" font-size="8.5" fill="#9b4a4a" text-anchor="middle">overruns both neighbours</text><text x="16" y="417" font-size="10" fill="#6A655F">But the file spells accidentals as WORDS: `watch.key.tonic` is '{letter} {accidental}', « bémol », « dièse » (`:1538`, `:1540`).</text><text x="16" y="440" font-size="10" fill="#6A655F">Second finding, and it is in BOTH languages: the readout says « Un demi-ton » and « Un ton », which are tone-words, while</text><text x="16" y="454" font-size="10" fill="#6A655F">the first two abbreviations say 2m and 2M, which are interval-words. Your consistency rule is already strained there.</text></svg>