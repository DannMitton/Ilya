<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="Source Sans 3, system-ui, sans-serif"><rect width="700" height="400" fill="#F0EBE0"/><text x="16" y="22" font-size="13" font-weight="600" fill="#1a1612">Grey box gone, spellings only where she stands</text><text x="16" y="40" font-size="10.5" font-weight="600" fill="#4a4540">At rest on the printed key</text><rect x="16" y="48" width="660" height="140" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="74" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">D major</text><text x="47" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−6</text><text x="95" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−5</text><text x="143" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−4</text><text x="191" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−3</text><text x="239" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−2</text><text x="287" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−1</text><text x="335" y="102" font-size="12" font-weight="700" fill="#6C4D8C" text-anchor="middle">0</text><text x="383" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+1</text><text x="431" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+2</text><text x="479" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+3</text><text x="527" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+4</text><text x="575" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+5</text><text x="623" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+6</text><rect x="47" y="121" width="576" height="6" rx="3" fill="#E2DAEB"/><circle cx="47" cy="124" r="2.6" fill="#9F85BC"/><circle cx="95" cy="124" r="2.6" fill="#9F85BC"/><circle cx="143" cy="124" r="2.6" fill="#9F85BC"/><circle cx="191" cy="124" r="2.6" fill="#9F85BC"/><circle cx="239" cy="124" r="2.6" fill="#9F85BC"/><circle cx="287" cy="124" r="2.6" fill="#9F85BC"/><circle cx="335" cy="124" r="3.8" fill="none" stroke="#1a1612" stroke-width="1.7"/><circle cx="383" cy="124" r="2.6" fill="#9F85BC"/><circle cx="431" cy="124" r="2.6" fill="#9F85BC"/><circle cx="479" cy="124" r="2.6" fill="#9F85BC"/><circle cx="527" cy="124" r="2.6" fill="#9F85BC"/><circle cx="575" cy="124" r="2.6" fill="#9F85BC"/><circle cx="623" cy="124" r="2.6" fill="#9F85BC"/><circle cx="335" cy="124" r="11" fill="#6C4D8C"/><circle cx="335" cy="124" r="11" fill="none" stroke="#fff" stroke-width="2"/><text x="47" y="150" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="150" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="150" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="150" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="239" y="150" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="150" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="335" y="150" font-size="10" fill="#6A655F" text-anchor="middle">ORIG.</text><text x="383" y="150" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="150" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="150" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="150" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="150" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="150" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="205" font-size="10" fill="#6A655F">No box behind the zero. The ring on the track and ORIG. carry it, and ORIG. reads aloud where a tint cannot.</text><text x="16" y="232" font-size="10.5" font-weight="600" fill="#4a4540">On −1, the one node she is standing on</text><rect x="16" y="240" width="660" height="140" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="266" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a semitone · D♭ major</text><text x="47" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−6</text><text x="95" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−5</text><text x="143" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−4</text><text x="191" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−3</text><text x="239" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−2</text><text x="287" y="294" font-size="12" font-weight="700" fill="#6C4D8C" text-anchor="middle">−1</text><text x="335" y="294" font-size="12" font-weight="400" fill="#1a1612" text-anchor="middle">0</text><text x="383" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+1</text><text x="431" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+2</text><text x="479" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+3</text><text x="527" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+4</text><text x="575" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+5</text><text x="623" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+6</text><rect x="47" y="313" width="576" height="6" rx="3" fill="#E2DAEB"/><rect x="287" y="313" width="48" height="6" rx="3" fill="#6C4D8C" opacity="0.55"/><circle cx="47" cy="316" r="2.6" fill="#9F85BC"/><circle cx="95" cy="316" r="2.6" fill="#9F85BC"/><circle cx="143" cy="316" r="2.6" fill="#9F85BC"/><circle cx="191" cy="316" r="2.6" fill