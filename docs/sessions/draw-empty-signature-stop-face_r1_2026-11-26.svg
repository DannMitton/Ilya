<svg xmlns="http://www.w3.org/2000/svg" width="460" height="510" viewBox="0 0 460 510" font-family="'Source Sans 3', system-ui, -apple-system, sans-serif">
<rect width="460" height="510" fill="#F0EBE0"/>
<text x="24" y="28" font-size="13" font-weight="600" fill="#1a1612">The empty-signature stop face</text>
<text x="24" y="44" font-size="11" fill="#6A655F">A print in 2 sharps, no mode stated. Every face becomes a count, so one stop has no count to show.</text>

<text x="24" y="74" font-size="11" font-weight="600" fill="#4a4540">DESKTOP RULER · 34 px stop · 12 px type</text>

<text x="24" y="98" font-size="10" fill="#6A655F">face 0</text>
<g>
<rect x="40" y="106" width="34" height="34" rx="6" fill="#e8e4dc"/>
<text x="57" y="128" font-size="12" fill="#1a1612" text-anchor="middle">2♯</text>
<text x="99" y="128" font-size="12" fill="#6A655F" text-anchor="middle">1♯</text>
<circle cx="141" cy="123" r="15" fill="#6C4D8C"/>
<text x="141" y="128" font-size="12" fill="#ffffff" text-anchor="middle">0</text>
<text x="183" y="128" font-size="12" fill="#6A655F" text-anchor="middle">1♭</text>
<text x="225" y="128" font-size="12" fill="#6A655F" text-anchor="middle">2♭</text>
<path d="M 250 104 L 250 110 M 250 104 Q 250 102 252 102 L 310 102 Q 312 102 312 104 L 312 110" fill="none" stroke="#E2DAEB" stroke-width="1.5"/>
<text x="265" y="128" font-size="12" fill="#6A655F" text-anchor="middle">5♯</text>
<text x="297" y="128" font-size="12" fill="#6A655F" text-anchor="middle">7♭</text>
</g>
<text x="40" y="158" font-size="11" fill="#4a4540">Down a whole tone · No sharps or flats</text>

<text x="24" y="188" font-size="10" fill="#6A655F">face ♮</text>
<g>
<rect x="40" y="196" width="34" height="34" rx="6" fill="#e8e4dc"/>
<text x="57" y="218" font-size="12" fill="#1a1612" text-anchor="middle">2♯</text>
<text x="99" y="218" font-size="12" fill="#6A655F" text-anchor="middle">1♯</text>
<circle cx="141" cy="213" r="15" fill="#6C4D8C"/>
<text x="141" y="218" font-size="12" fill="#ffffff" text-anchor="middle">♮</text>
<text x="183" y="218" font-size="12" fill="#6A655F" text-anchor="middle">1♭</text>
<text x="225" y="218" font-size="12" fill="#6A655F" text-anchor="middle">2♭</text>
<path d="M 250 194 L 250 200 M 250 194 Q 250 192 252 192 L 310 192 Q 312 192 312 194 L 312 200" fill="none" stroke="#E2DAEB" stroke-width="1.5"/>
<text x="265" y="218" font-size="12" fill="#6A655F" text-anchor="middle">5♯</text>
<text x="297" y="218" font-size="12" fill="#6A655F" text-anchor="middle">7♭</text>
</g>
<text x="40" y="248" font-size="11" fill="#4a4540">Down a whole tone · No sharps or flats</text>

<line x1="24" y1="272" x2="436" y2="272" stroke="#E2DAEB" stroke-width="1"/>
<text x="24" y="296" font-size="11" font-weight="600" fill="#4a4540">PHONE DOCK · 44 px stop · 13 px type</text>

<text x="24" y="320" font-size="10" fill="#6A655F">face 0</text>
<g>
<rect x="40" y="328" width="44" height="44" rx="8" fill="#e8e4dc"/>
<text x="62" y="355" font-size="13" fill="#1a1612" text-anchor="middle">2♯</text>
<text x="114" y="355" font-size="13" fill="#6A655F" text-anchor="middle">1♯</text>
<circle cx="166" cy="350" r="20" fill="#6C4D8C"/>
<text x="166" y="355" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">0</text>
<text x="218" y="355" font-size="13" fill="#6A655F" text-anchor="middle">1♭</text>
<text x="270" y="355" font-size="13" fill="#6A655F" text-anchor="middle">2♭</text>
<path d="M 300 326 L 300 332 M 300 326 Q 300 324 302 324 L 380 324 Q 382 324 382 326 L 382 332" fill="none" stroke="#E2DAEB" stroke-width="1.5"/>
<text x="320" y="355" font-size="13" fill="#6A655F" text-anchor="middle">5♯</text>
<text x="362" y="355" font-size="13" fill="#6A655F" text-anchor="middle">7♭</text>
</g>

<text x="24" y="400" font-size="10" fill="#6A655F">face ♮</text>
<g>
<rect x="40" y="408" width="44" height="44" rx="8" fill="#e8e4dc"/>
<text x="62" y="435" font-size="13" fill="#1a1612" text-anchor="middle">2♯</text>
<text x="114" y="435" font-size="13" fill="#6A655F" text-anchor="middle">1♯</text>
<circle cx="166" cy="430" r="20" fill="#6C4D8C"/>
<text x="166" y="435" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">♮</text>
<text x="218" y="435" font-size="13" fill="#6A655F" text-anchor="middle">1♭</text>
<text x="270" y="435" font-size="13" fill="#6A655F" text-anchor="middle">2♭</text>
<path d="M 300 406 L 300 412 M 300 406 Q 300 404 302 404 L 380 404 Q 382 404 382 406 L 382 412" fill="none" stroke="#E2DAEB" stroke-width="1.5"/>
<text x="320" y="435" font-size="13" fill="#6A655F" text-anchor="middle">5♯</text>
<text x="362" y="435" font-size="13" fill="#6A655F" text-anchor="middle">7♭</text>
</g>

<text x="24" y="478" font-size="10" fill="#6A655F">WITHDRAWN 2026-11-26: the stop ORDER here was invented, not read. The shipped ruler runs low</text>
<text x="24" y="492" font-size="10" fill="#6A655F">pitch at the LEFT, and these stops are not adjacent on it. The surface is wrong too. Do not use.</text>
</svg>
