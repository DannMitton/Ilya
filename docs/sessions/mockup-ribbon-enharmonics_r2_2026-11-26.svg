<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" font-family="Source Sans 3, system-ui, sans-serif"><rect width="700" height="520" fill="#F0EBE0"/><text x="16" y="22" font-size="13" font-weight="600" fill="#1a1612">Replacing the dot — three more literal ways (she is on −1, which has two spellings)</text><text x="16" y="40" font-size="10.5" font-weight="600" fill="#4a4540">A · Nothing on the ribbon. The readout says it in words.</text><rect x="16" y="48" width="660" height="116" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="74" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a semitone · D♭ major</text><rect x="424" y="58" width="128" height="22" rx="11" fill="none" stroke="#9F85BC"/><text x="488" y="73" font-size="10.5" fill="#9F85BC" text-anchor="middle">Spell it C♯ instead</text><text x="47" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="126" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="126" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="239" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−2</text><text x="239" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><circle cx="287" cy="101" r="15" fill="#6C4D8C"/><text x="287" y="105" font-size="12" fill="#fff" text-anchor="middle">−1</text><text x="287" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><rect x="318" y="86" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="105" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="126" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="126" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="126" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="181" font-size="10" fill="#6A655F">Nothing to decode, because there is no symbol. She learns of the choice at the moment it matters.</text><text x="16" y="204" font-size="10.5" font-weight="600" fill="#4a4540">B · A flat and a sharp under the stop</text><rect x="16" y="212" width="660" height="116" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="238" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a semitone · D♭ major</text><rect x="424" y="222" width="128" height="22" rx="11" fill="none" stroke="#9F85BC"/><text x="488" y="237" font-size="10.5" fill="#9F85BC" text-anchor="middle">Spell it C♯ instead</text><text x="47" y="269" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="290" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="269" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="290" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="269" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="290" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="269" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="290" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="191" y="303" font-size="9" fill="#9F85BC" text-anchor="middle">♭/♯</text><text x="239" y="269" font-size="12" fill="#6A655F" text-anchor="middle">−2</text><text x="239" y="290" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><circle cx="287" cy="265" r="15" fill="#6C4D8C"/><text x="287" y="269" font-size="12" fill="#fff" text-anchor="middle">−1</text><text x="287" y="290" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="287" y="303" font-size="9" fill="#9F85BC" text-anchor="middle">♭/♯</text><rect x="318" y="250" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="269" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="290" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="269" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="290" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="269" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="290" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="269" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="290" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="269" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="290" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="527" y="303" font-size="9" fill="#9F85BC" text-anchor="middle">♭/♯</text><text x="575" y="269" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="290" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="269" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="290" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="345" font-size="10" fill="#6A655F">Says 'this one can be written flat or sharp' without words. Still a symbol, but a musical one.</text><text x="16" y="368" font-size="10.5" font-weight="600" fill="#4a4540">C · Both spellings printed under the stop</text><rect x="16" y="376" width="660" height="116" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="402" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a semitone · D♭ major</text><rect x="424" y="386" width="128" height="22" rx="11" fill="none" stroke="#9F85BC"/><text x="488" y="401" font-size="10.5" fill="#9F85BC" text-anchor="middle">Spell it C♯ instead</text><text x="47" y="433" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="454" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="433" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="454" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="433" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="454" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="433" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="454" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="191" y="467" font-size="8.5" fill="#9F85BC" text-anchor="middle">B/C♭</text><text x="239" y="433" font-size="12" fill="#6A655F" text-anchor="middle">−2</text><text x="239" y="454" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><circle cx="287" cy="429" r="15" fill="#6C4D8C"/><text x="287" y="433" font-size="12" fill="#fff" text-anchor="middle">−1</text><text x="287" y="454" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="287" y="467" font-size="8.5" fill="#9F85BC" text-anchor="middle">D♭/C♯</text><rect x="318" y="414" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="433" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="454" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="433" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="454" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="433" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="454" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="433" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="454" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="433" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="454" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="527" y="467" font-size="8.5" fill="#9F85BC" text-anchor="middle">F♯/G♭</text><text x="575" y="433" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="454" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="433" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="454" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="509" font-size="10" fill="#6A655F">Wholly literal. Costs 8.5 px type, below anything Ilya ships, and it crowds a 34 px face on a phone.</text></svg>