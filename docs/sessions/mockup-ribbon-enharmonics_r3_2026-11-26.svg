ke="#6A655F" stroke-width="1.5"/><line x1="527" y1="321" x2="527" y2="326" stroke="#6A655F" stroke-width="1.5"/><line x1="575" y1="321" x2="575" y2="326" stroke="#6A655F" stroke-width="1.5"/><line x1="623" y1="321" x2="623" y2="326" stroke="#6A655F" stroke-width="1.5"/><circle cx="287" cy="316" r="11" fill="#6C4D8C"/><circle cx="287" cy="316" r="11" fill="none" stroke="#fff" stroke-width="2"/><text x="47" y="342" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="342" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="342" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="342" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="191" y="356" font-size="8.5" fill="#9F85BC" text-anchor="middle">B/C♭</text><text x="239" y="342" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="342" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="287" y="356" font-size="8.5" fill="#9F85BC" text-anchor="middle">D♭/C♯</text><text x="335" y="342" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="342" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="342" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="342" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="342" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="527" y="356" font-size="8.5" fill="#9F85BC" text-anchor="middle">F♯/G♭</text><text x="575" y="342" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="342" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><rect x="596" y="302" width="56" height="24" rx="12" fill="none" stroke="#9F85BC"/><rect x="597" y="303" width="28" height="22" rx="11" fill="#6C4D8C"/><text x="611" y="319" font-size="12" fill="#fff" text-anchor="middle">♭</text><text x="639" y="319" font-size="12" fill="#9F85BC" text-anchor="middle">♯</text><text x="16" y="397" font-size="10" fill="#6A655F">A single ♭/♯ preference at the end of the track. One decision, not three, and readers do have a lean.</text><text x="16" y="424" font-size="10.5" font-weight="600" fill="#4a4540">C · The thumb carries it</text><rect x="16" y="432" width="660" height="140" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="458" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a semitone · D♭ major</text><text x="47" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−6</text><text x="95" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−5</text><text x="143" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−4</text><text x="191" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−3</text><text x="239" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−2</text><text x="287" y="486" font-size="12" font-weight="700" fill="#6C4D8C" text-anchor="middle">−1</text><rect x="320" y="472" width="30" height="19" rx="5" fill="#e8e4dc"/><text x="335" y="486" font-size="12" font-weight="400" fill="#1a1612" text-anchor="middle">0</text><text x="383" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+1</text><text x="431" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+2</text><text x="479" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+3</text><text x="527" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+4</text><text x="575" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+5</text><text x="623" y="486" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+6</text><rect x="47" y="505" width="576" height="6" rx="3" fill="#E2DAEB"/><rect x="287" y="505" width="48" height="6" rx="3"