text><text x="287" y="150" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="277" y="164" font-size="8.5" font-weight="700" fill="#6C4D8C" text-anchor="middle">D♭</text><text x="287" y="164" font-size="8.5" fill="#6A655F" text-anchor="middle">/</text><text x="298" y="164" font-size="8.5" fill="#6A655F" text-anchor="middle" opacity="0.55">C♯</text><text x="335" y="150" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="150" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="150" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="150" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="150" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="517" y="164" font-size="8.5" font-weight="700" fill="#6C4D8C" text-anchor="middle">F♯</text><text x="527" y="164" font-size="8.5" fill="#6A655F" text-anchor="middle">/</text><text x="538" y="164" font-size="8.5" fill="#6A655F" text-anchor="middle" opacity="0.55">G♭</text><text x="575" y="150" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="150" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="205" font-size="10" fill="#6A655F">Live spelling bold, the other faded. Tap the faded half to swap. No new chrome at all: the label is the control.</text><text x="16" y="232" font-size="10.5" font-weight="600" fill="#4a4540">B · One lean for the whole ribbon</text><rect x="16" y="240" width="660" height="140" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="266" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a semitone · D♭ major</text><text x="47" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−6</text><text x="95" y="294" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−5</text><text x="143" y="294" font-size="12" font-weight="400" fill="#6A655F"