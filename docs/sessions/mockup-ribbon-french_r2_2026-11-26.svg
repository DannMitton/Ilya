eight="700" fill="#6C4D8C" text-anchor="end">ré bémol</text><text x="287" y="170" font-size="9.5" fill="#6A655F" text-anchor="middle">/</text><text x="292" y="170" font-size="9.5" fill="#6A655F" text-anchor="start" opacity="0.6">do dièse</text><text x="16" y="217" font-size="10" fill="#6A655F">Centred under its node. The row is empty either side, so the words use the width freely.</text><text x="16" y="240" font-size="10.5" font-weight="600" fill="#4a4540">Au bord du ruban — poussé vers l’intérieur</text><rect x="16" y="248" width="660" height="152" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="274" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Un triton plus haut · sol bémol majeur</text><text x="47" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−6</text><text x="95" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−5</text><text x="143" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−4</text><text x="191" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−3</text><text x="239" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−2</text><text x="287" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−1</text><text x="335" y="302" font-size="12" font-weight="400" fill="#1a1612" text-anchor="middle">0</text><text x="383" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+1</text><text x="431" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+2</text><text x="479" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+3</text><text x="527" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+4</text><text x="575" y="302" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+5</text><text x="623" y="302" font-size="12" font-weight="7