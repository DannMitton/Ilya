<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="Source Sans 3, system-ui, sans-serif"><rect width="700" height="470" fill="#F0EBE0"/><text x="16" y="22" font-size="13" font-weight="600" fill="#1a1612">Les mots entiers, centrés sous le cran</text><text x="16" y="40" font-size="10.5" font-weight="600" fill="#4a4540">Au milieu du ruban — centré</text><rect x="16" y="48" width="660" height="152" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="74" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Un demi-ton plus bas · ré bémol majeur</text><text x="47" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−6</text><text x="95" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−5</text><text x="143" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−4</text><text x="191" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−3</text><text x="239" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">−2</text><text x="287" y="102" font-size="12" font-weight="700" fill="#6C4D8C" text-anchor="middle">−1</text><text x="335" y="102" font-size="12" font-weight="400" fill="#1a1612" text-anchor="middle">0</text><text x="383" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+1</text><text x="431" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+2</text><text x="479" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+3</text><text x="527" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+4</text><text x="575" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+5</text><text x="623" y="102" font-size="12" font-weight="400" fill="#6A655F" text-anchor="middle">+6</text><rect x="47" y="121" width="576" height="6" rx="3" fill="#E2D