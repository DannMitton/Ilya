e="10" fill="#6A655F" text-anchor="middle">TT</text><text x="584" y="370" font-size="9.5" font-weight="700" fill="#6C4D8C" text-anchor="end">sol bémol</text><text x="589" y="370" font-size="9.5" fill="#6A655F" text-anchor="middle">/</text><text x="594" y="370" font-size="9.5" fill="#6A655F" text-anchor="start" opacity="0.6">fa dièse</text><text x="16" y="417" font-size="10" fill="#6A655F">At −6 or +6 a centred pair would run off the card, so it shifts inward and the slash no longer sits under the node.</text><text x="16" y="452" font-size="10" fill="#6A655F">The ends can be pair nodes on prints of one flat, none, or one sharp, so this case is real rather than hypothetical.</text></svg>