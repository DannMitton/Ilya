<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" font-family="Source Sans 3, system-ui, sans-serif"><rect width="700" height="470" fill="#F0EBE0"/><text x="16" y="22" font-size="13" font-weight="600" fill="#1a1612">The tap is the commit. No standing buttons.</text><text x="16" y="40" font-size="10.5" font-weight="600" fill="#4a4540">1 · Open, sitting on the printed key</text><rect x="16" y="48" width="660" height="104" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="74" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">D major</text><text x="47" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="126" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="126" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="239" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−2</text><text x="239" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−1</text><text x="287" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><rect x="318" y="86" width="34" height="46" rx="6" fill="#e8e4dc"/><circle cx="335" cy="101" r="15" fill="#6C4D8C"/><text x="335" y="105" font-size="12" fill="#fff" text-anchor="middle">0</text><text x="335" y="126" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="126" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="126" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="169" font-size="10" fill="#6A655F">Nothing but the ribbon. She is not being asked to decide anything yet.</text><text x="16" y="192" font-size="10.5" font-weight="600" fill="#4a4540">2 · She taps −2. The paper redraws at once.</text><rect x="16" y="200" width="660" height="104" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="226" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a whole tone · C major</text><text x="47" y="257" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="278" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="257" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="278" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="257" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="278" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="257" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="278" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><circle cx="239" cy="253" r="15" fill="#6C4D8C"/><text x="239" y="257" font-size="12" fill="#fff" text-anchor="middle">−2</text><text x="239" y="278" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="257" font-size="12" fill="#6A655F" text-anchor="middle">−1</text><text x="287" y="278" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><rect x="318" y="238" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="257" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="278" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="278" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="278" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="278" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="278" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="278" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="278" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="600" y="296" font-size="11" fill="#6A655F">↩  Undo</text><text x="16" y="321" font-size="10" fill="#6A655F">Verification, not a gate: the readout names what just happened and Undo takes it back. Nothing to confirm.</text><text x="16" y="344" font-size="10.5" font-weight="600" fill="#4a4540">3 · She taps away. The ribbon closes and the change stands.</text><rect x="16" y="352" width="300" height="52" rx="10" fill="#FAF8F3" stroke="#E2DAEB"/><text x="32" y="383" font-size="12" fill="#1a1612">Key: <tspan font-weight="700">C major</tspan>, transposed</text><rect x="222" y="365" width="80" height="26" rx="13" fill="none" stroke="#1a1612"/><text x="262" y="382" font-size="11" fill="#1a1612" text-anchor="middle">As printed</text><text x="16" y="424" font-size="10" fill="#6A655F">The PIECE band already carries the result and the way back, so the ribbon needs no Cancel of its own.</text><text x="16" y="452" font-size="10.5" fill="#1a1612">Faces here use the abbreviations from variant A. If you prefer B’s words, the behaviour is unchanged.</text></svg>