<svg xmlns="http://www.w3.org/2000/svg" width="700" height="580" viewBox="0 0 700 580" font-family="Source Sans 3, system-ui, sans-serif"><rect width="700" height="580" fill="#F0EBE0"/><text x="16" y="22" font-size="13" font-weight="600" fill="#1a1612">Drag to choose. She lands only when she lifts.</text><text x="16" y="40" font-size="10.5" font-weight="600" fill="#4a4540">1 · Finger down on the printed key</text><rect x="16" y="48" width="660" height="106" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="74" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">D major</text><text x="47" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="126" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="126" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="239" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−2</text><text x="239" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−1</text><text x="287" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><rect x="318" y="86" width="34" height="46" rx="6" fill="#e8e4dc"/><circle cx="335" cy="101" r="15" fill="none" stroke="#6C4D8C" stroke-width="2"/><text x="335" y="105" font-size="12" fill="#6C4D8C" text-anchor="middle">0</text><text x="335" y="126" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="126" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="126" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><circle cx="335" cy="101" r="20" fill="#1a1612" opacity="0.22"/><circle cx="335" cy="101" r="20" fill="none" stroke="#1a1612" stroke-width="1.5"/><text x="16" y="171" font-size="10" fill="#6A655F">Touching changes nothing yet. The circle is hollow: this is where her finger is, not a decision.</text><text x="16" y="192" font-size="10.5" font-weight="600" fill="#4a4540">2 · Sliding left. The readout follows her.</text><rect x="16" y="200" width="660" height="106" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="226" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a semitone · D♭ major</text><text x="47" y="257" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="278" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="257" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="278" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="257" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="278" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="257" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="278" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="239" y="257" font-size="12" fill="#6A655F" text-anchor="middle">−2</text><text x="239" y="278" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><circle cx="287" cy="253" r="15" fill="none" stroke="#6C4D8C" stroke-width="2"/><text x="287" y="257" font-size="12" fill="#6C4D8C" text-anchor="middle">−1</text><text x="287" y="278" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><rect x="318" y="238" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="257" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="278" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="278" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="278" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="278" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="278" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="278" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="257" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="278" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><path d="M 335 253 L 296 253" stroke="#6A655F" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/><path d="M 287 253 l 7 -4 l 0 8 z" fill="#6A655F"/><circle cx="287" cy="253" r="20" fill="#1a1612" opacity="0.22"/><circle cx="287" cy="253" r="20" fill="none" stroke="#1a1612" stroke-width="1.5"/><text x="16" y="323" font-size="10" fill="#6A655F">The paper has not redrawn. Only the readout moves, so scrubbing stays smooth on a phone.</text><text x="16" y="344" font-size="10.5" font-weight="600" fill="#4a4540">3 · Still sliding. She overshoots and comes back.</text><rect x="16" y="352" width="660" height="106" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="378" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a whole tone · C major</text><text x="47" y="409" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="430" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="409" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="430" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="409" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="430" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="409" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="430" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><circle cx="239" cy="405" r="15" fill="none" stroke="#6C4D8C" stroke-width="2"/><text x="239" y="409" font-size="12" fill="#6C4D8C" text-anchor="middle">−2</text><text x="239" y="430" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="409" font-size="12" fill="#6A655F" text-anchor="middle">−1</text><text x="287" y="430" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><rect x="318" y="390" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="409" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="430" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="409" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="430" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="409" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="430" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="409" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="430" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="409" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="430" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="409" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="430" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="409" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="430" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><path d="M 335 405 L 248 405" stroke="#6A655F" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/><path d="M 239 405 l 7 -4 l 0 8 z" fill="#6A655F"/><circle cx="239" cy="405" r="20" fill="#1a1612" opacity="0.22"/><circle cx="239" cy="405" r="20" fill="none" stroke="#1a1612" stroke-width="1.5"/><text x="16" y="475" font-size="10" fill="#6A655F">Nothing is committed, so a wrong stop costs her nothing. This is the mis-tap protection, before the fact.</text><text x="16" y="496" font-size="10.5" font-weight="600" fill="#4a4540">4 · She lifts. Now it lands.</text><rect x="16" y="504" width="660" height="106" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="530" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a whole tone · C major</text><text x="47" y="561" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="582" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="561" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="582" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="561" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="582" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="561" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="582" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><circle cx="239" cy="557" r="15" fill="#6C4D8C"/><text x="239" y="561" font-size="12" fill="#fff" text-anchor="middle">−2</text><text x="239" y="582" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="561" font-size="12" fill="#6A655F" text-anchor="middle">−1</text><text x="287" y="582" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><rect x="318" y="542" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="561" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="582" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="561" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="582" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="561" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="582" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="561" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="582" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="561" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="582" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="575" y="561" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="582" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="561" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="582" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><circle cx="239" cy="557" r="20" fill="none" stroke="#6A655F" stroke-width="1.5" stroke-dasharray="3 3"/><text x="600" y="600" font-size="11" fill="#6A655F">↩  Undo</text><text x="16" y="627" font-size="10" fill="#6A655F">The circle fills, the paper redraws once, and Undo appears. One redraw per gesture, not per tick.</text></svg>