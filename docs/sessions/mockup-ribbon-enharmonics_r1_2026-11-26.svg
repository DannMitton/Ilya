<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" viewBox="0 0 700 500" font-family="Source Sans 3, system-ui, sans-serif"><rect width="700" height="500" fill="#F0EBE0"/><text x="16" y="22" font-size="13" font-weight="600" fill="#1a1612">Enharmonic respelling — the small dot marks a stop that has two</text><text x="16" y="40" font-size="10.5" font-weight="600" fill="#4a4540">1 · A stop with only one spelling</text><rect x="16" y="48" width="660" height="108" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="74" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a whole tone · C major</text><text x="47" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="126" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="126" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><circle cx="191" cy="136" r="2" fill="#9F85BC"/><circle cx="239" cy="101" r="15" fill="#6C4D8C"/><text x="239" y="105" font-size="12" fill="#fff" text-anchor="middle">−2</text><text x="239" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="287" y="105" font-size="12" fill="#6A655F" text-anchor="middle">−1</text><text x="287" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><circle cx="287" cy="136" r="2" fill="#9F85BC"/><rect x="318" y="86" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="105" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="126" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="126" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="126" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><circle cx="527" cy="136" r="2" fill="#9F85BC"/><text x="575" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="126" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="105" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="126" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="173" font-size="10" fill="#6A655F">No dot under −2, so no choice exists and nothing is offered. Most stops are like this.</text><text x="16" y="196" font-size="10.5" font-weight="600" fill="#4a4540">2 · A stop with two. Ilya lands on the cleaner one.</text><rect x="16" y="204" width="660" height="108" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="230" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a semitone · D♭ major</text><rect x="420" y="214" width="118" height="22" rx="11" fill="none" stroke="#9F85BC"/><text x="479" y="229" font-size="10.5" fill="#9F85BC" text-anchor="middle">⇄ or C♯ major</text><text x="47" y="261" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="282" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="261" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="282" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="261" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="282" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="261" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="282" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><circle cx="191" cy="292" r="2" fill="#9F85BC"/><text x="239" y="261" font-size="12" fill="#6A655F" text-anchor="middle">−2</text><text x="239" y="282" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><circle cx="287" cy="257" r="15" fill="#6C4D8C"/><text x="287" y="261" font-size="12" fill="#fff" text-anchor="middle">−1</text><text x="287" y="282" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><circle cx="287" cy="292" r="2" fill="#9F85BC"/><rect x="318" y="242" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="261" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="282" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="261" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="282" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="261" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="282" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="261" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="282" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="261" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="282" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><circle cx="527" cy="292" r="2" fill="#9F85BC"/><text x="575" y="261" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="282" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="261" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="282" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="329" font-size="10" fill="#6A655F">Dot under −1. Ilya chose D♭ because C♯ draws more double accidentals — your ruling of 2026-09-28.</text><text x="16" y="352" font-size="10.5" font-weight="600" fill="#4a4540">3 · She taps the swap.</text><rect x="16" y="360" width="660" height="108" rx="12" fill="#FAF8F3" stroke="#1a1612" stroke-width="1.4"/><text x="346" y="386" font-size="14" font-weight="600" fill="#1a1612" text-anchor="middle">Down a semitone · C♯ major</text><rect x="420" y="370" width="118" height="22" rx="11" fill="none" stroke="#9F85BC"/><text x="479" y="385" font-size="10.5" fill="#9F85BC" text-anchor="middle">⇄ or D♭ major</text><text x="47" y="417" font-size="12" fill="#6A655F" text-anchor="middle">−6</text><text x="47" y="438" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="95" y="417" font-size="12" fill="#6A655F" text-anchor="middle">−5</text><text x="95" y="438" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="143" y="417" font-size="12" fill="#6A655F" text-anchor="middle">−4</text><text x="143" y="438" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><text x="191" y="417" font-size="12" fill="#6A655F" text-anchor="middle">−3</text><text x="191" y="438" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><circle cx="191" cy="448" r="2" fill="#9F85BC"/><text x="239" y="417" font-size="12" fill="#6A655F" text-anchor="middle">−2</text><text x="239" y="438" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><circle cx="287" cy="413" r="15" fill="#6C4D8C"/><text x="287" y="417" font-size="12" fill="#fff" text-anchor="middle">−1</text><text x="287" y="438" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><circle cx="287" cy="448" r="2" fill="#9F85BC"/><rect x="318" y="398" width="34" height="46" rx="6" fill="#e8e4dc"/><text x="335" y="417" font-size="12" fill="#1a1612" text-anchor="middle">0</text><text x="335" y="438" font-size="10" fill="#6A655F" text-anchor="middle">—</text><text x="383" y="417" font-size="12" fill="#6A655F" text-anchor="middle">+1</text><text x="383" y="438" font-size="10" fill="#6A655F" text-anchor="middle">m2</text><text x="431" y="417" font-size="12" fill="#6A655F" text-anchor="middle">+2</text><text x="431" y="438" font-size="10" fill="#6A655F" text-anchor="middle">M2</text><text x="479" y="417" font-size="12" fill="#6A655F" text-anchor="middle">+3</text><text x="479" y="438" font-size="10" fill="#6A655F" text-anchor="middle">m3</text><text x="527" y="417" font-size="12" fill="#6A655F" text-anchor="middle">+4</text><text x="527" y="438" font-size="10" fill="#6A655F" text-anchor="middle">M3</text><circle cx="527" cy="448" r="2" fill="#9F85BC"/><text x="575" y="417" font-size="12" fill="#6A655F" text-anchor="middle">+5</text><text x="575" y="438" font-size="10" fill="#6A655F" text-anchor="middle">P4</text><text x="623" y="417" font-size="12" fill="#6A655F" text-anchor="middle">+6</text><text x="623" y="438" font-size="10" fill="#6A655F" text-anchor="middle">TT</text><text x="16" y="485" font-size="10" fill="#6A655F">The paper respells at once. Tapping again returns to D♭. Two options only, never a menu.</text><text x="16" y="492" font-size="10" fill="#6A655F">On your score only −3, −1 and +4 carry a dot. C/B♯ never appears: B♯ major needs twelve sharps, and the ribbon only holds seven.</text></svg>