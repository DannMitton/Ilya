<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
  // Row 163. A returning singer whose browser holds an older page can ask for an
  // entry file the last deploy removed. The page then loads again once, which
  // fetches the current one. The flag lives in sessionStorage; where storage
  // throws, nothing is done, so a failure can never loop.
  (function () {
    var KEY = 'ilya-chunk-reload';
    var STALE = /dynamically imported module|Importing a module script failed/i;
    function reloadOnce() {
      try {
        if (sessionStorage.getItem(KEY)) return;
        sessionStorage.setItem(KEY, '1');
      } catch (e) {
        return;
      }
      location.reload();
    }
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var m = r && (r.message || String(r));
      if (m && STALE.test(m)) reloadOnce();
    });
    window.addEventListener(
      'error',
      function (e) {
        var t = e.target;
        if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK') && /\/_app\/immutable\//.test(t.src || t.href || '')) reloadOnce();
      },
      true
    );
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="%sveltekit.assets%/favicon.png" />
<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
<meta name="theme-color" content="#839275" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Ilya" />
<title>Ilya — Russian Lyric Diction</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap"
rel="stylesheet"
/>
%sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
<div style="display: contents">%sveltekit.body%</div>
<script>
  // Production only: a service worker on localhost serves stale dev bundles
  // (stale-while-revalidate cached an old route manifest and 404'd new
  // routes, 2026-07-12). Any worker registered by an earlier dev session
  // is actively unregistered so its caches stop intercepting.
  if ('serviceWorker' in navigator) {
    const isDevHost = ['localhost', '127.0.0.1'].includes(location.hostname);
    window.addEventListener('load', () => {
      if (isDevHost) {
        navigator.serviceWorker.getRegistrations()
          .then((rs) => rs.forEach((r) => r.unregister()))
          .catch(() => {});
      } else {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    });
  }
</script>
</body>
</html>
