name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the older run, which can no longer
# land anyway. Added on the audit branch, 2026-09-26.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, type-check, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Type-check the whole web project with svelte-check, including modules that
      # nothing imports yet (the engine batch core). vite build tree-shakes those
      # away and esbuild does not type-check, so this step is what actually guards
      # them. The branch carries a known baseline of pre-existing errors, so this
      # gate fails only when the count rises above that baseline: green means this
      # push added zero new type errors. The live count prints on every run, so if
      # the real baseline ever differs from the number below, the log shows it and
      # you change one value.
      - name: Type-check (svelte-check, gated on baseline)
        working-directory: apps/web
        env:
          # Lowered from 23 to 0 on the audit branch, 2026-09-26: the branch
          # measured 0 errors at b7c2fc6, so the old number let 23 new errors
          # land unseen. It is a ratchet: it may fall, and it never rises.
          SVELTE_CHECK_BASELINE: "0"
          # Warnings ratchet the same way: 12 measured at b7c2fc6.
          SVELTE_CHECK_WARNINGS_BASELINE: "12"
        run: |
          # svelte-kit sync regenerates .svelte-kit/tsconfig.json that the app
          # tsconfig extends. It runs on install via the prepare script; run it
          # again explicitly so the generated config is guaranteed present.
          pnpm exec svelte-kit sync

          # svelte-check exits non-zero whenever any error exists, so capture the
          # output and decide from the baseline rather than from the exit code.
          pnpm exec svelte-check --tsconfig ./tsconfig.json --output machine \
            | tee svelte-check.log || true

          # The machine output ends with a line shaped like:
          #   <ts> COMPLETED <n> FILES <n> ERRORS <n> WARNINGS <n> FILES_WITH_PROBLEMS
          # Read the field immediately before the ERRORS token.
          ERRORS=$(awk '/ COMPLETED /{for (i = 1; i <= NF; i++) if ($i == "ERRORS") print $(i - 1)}' svelte-check.log)

          if [ -z "$ERRORS" ]; then
            echo "::error::svelte-check produced no COMPLETED line, so it likely crashed rather than reporting type errors. Failing so this is not a silent pass."
            exit 1
          fi

          echo "svelte-check errors: $ERRORS (baseline: $SVELTE_CHECK_BASELINE)"

          if [ "$ERRORS" -gt "$SVELTE_CHECK_BASELINE" ]; then
            echo "::error::svelte-check found $ERRORS errors, above the baseline of $SVELTE_CHECK_BASELINE. This push introduced new type errors; open the log above to see which files."
            exit 1
          fi

          WARNINGS=$(awk '/ COMPLETED /{for (i = 1; i <= NF; i++) if ($i == "WARNINGS") print $(i - 1)}' svelte-check.log)
          echo "svelte-check warnings: $WARNINGS (baseline: $SVELTE_CHECK_WARNINGS_BASELINE)"
          if [ "$WARNINGS" -gt "$SVELTE_CHECK_WARNINGS_BASELINE" ]; then
            echo "::error::svelte-check found $WARNINGS warnings, above the baseline of $SVELTE_CHECK_WARNINGS_BASELINE. Open the log above to see which files."
            exit 1
          fi

          echo "OK: no new type errors above the baseline of $SVELTE_CHECK_BASELINE."

      - name: Architecture ratchets (file size, layering, package surface)
        run: node scripts/ratchets.mjs

      - name: Run all tests
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @ilya/web build

  e2e:
    # The desktop end-to-end suite: what a singer sees, in a real browser.
    # Added on the audit branch, 2026-09-26, after the suite was found to have
    # failed silently from 5f6a2f3 (2026-09-07) with nothing running it.
    name: End-to-end (desktop)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright's browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium for Playwright
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run the desktop suite
        working-directory: apps/web
        run: pnpm exec playwright test --project=chromium

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 14
